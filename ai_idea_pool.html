<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 點子池 — 平台體驗升級計劃</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f4f0;
  --surface: #ffffff;
  --surface2: #f0efe9;
  --border: rgba(0,0,0,0.08);
  --border-hover: rgba(0,0,0,0.16);
  --text: #1a1a1a;
  --muted: #6b6b6b;
  --faint: #b0afa8;

  --green: #16a34a;
  --green-dim: rgba(22,163,74,0.09);
  --green-mid: rgba(22,163,74,0.2);
  --amber: #b45309;
  --amber-dim: rgba(180,83,9,0.09);
  --blue: #1d4ed8;
  --blue-dim: rgba(29,78,216,0.09);
  --pink: #be185d;
  --pink-dim: rgba(190,24,93,0.09);
  --purple: #6d28d9;
  --purple-dim: rgba(109,40,217,0.09);
  --coral: #c2410c;
  --coral-dim: rgba(194,65,12,0.09);
  --teal: #0f766e;
  --teal-dim: rgba(15,118,110,0.09);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sora', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ── HEADER ── */
header {
  padding: 3rem 2.5rem 2rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 2rem;
  flex-wrap: wrap;
}

.header-left {}
.eyebrow {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .12em;
  text-transform: uppercase;
  margin-bottom: .6rem;
}
h1 {
  font-size: clamp(22px, 3vw, 32px);
  font-weight: 600;
  color: var(--text);
  letter-spacing: -.02em;
  line-height: 1.2;
}
h1 span { color: var(--green); }
.header-sub {
  margin-top: .5rem;
  color: var(--muted);
  font-size: 13px;
  font-weight: 300;
}

.stats-row {
  display: flex;
  gap: 1rem;
  flex-shrink: 0;
}
.stat {
  text-align: center;
  padding: .75rem 1.25rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.stat-n {
  font-size: 24px;
  font-weight: 600;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.stat-l {
  font-size: 10px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  letter-spacing: .06em;
  margin-top: 2px;
}

/* ── TOOLBAR ── */
.toolbar {
  padding: 1.25rem 2.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
  background: rgba(245,244,240,.9);
  backdrop-filter: blur(12px);
}
.filter-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: .08em;
  text-transform: uppercase;
  white-space: nowrap;
}
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.fb {
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 100px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: all .2s;
  font-family: 'Sora', sans-serif;
  white-space: nowrap;
}
.fb:hover { border-color: var(--border-hover); color: var(--text); background: var(--surface); }
.fb.on { border-color: transparent; color: #ffffff; font-weight: 500; }
.fb.on.f-all    { background: #1a1a1a; }
.fb.on.f-ux     { background: var(--teal); }
.fb.on.f-ui     { background: var(--blue); }
.fb.on.f-fe     { background: var(--purple); }
.fb.on.f-be     { background: var(--amber); }
.fb.on.f-ai     { background: var(--pink); }
.fb.on.f-mkt    { background: var(--coral); }
.fb.on.f-predict{ background: var(--green); }
.fb.on.f-boost   { background: var(--amber); }
.fb.on.f-archive { background: #6b6b6b; }

/* ── MAIN ── */
main {
  padding: 2rem 2.5rem 4rem;
}

.section {
  margin-bottom: 2.5rem;
}
.section-header {
  display: flex;
  align-items: center;
  gap: .75rem;
  margin-bottom: 1rem;
}
.section-line {
  flex: 1;
  height: 1px;
  background: var(--border);
}
.section-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.section-count {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--faint);
  white-space: nowrap;
}

/* ── GRID ── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

/* ── CARD ── */
.card {
  background: var(--surface);
  padding: 1.25rem;
  cursor: pointer;
  transition: background .2s;
  position: relative;
}
.card:hover { background: var(--surface2); }
.card.open { background: var(--surface2); }
.card.open::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent-color, var(--green));
}

.new-dot {
  position: absolute;
  top: 14px; right: 14px;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--pink);
}

.ctop {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.cico {
  width: 30px; height: 30px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
  font-family: 'DM Mono', monospace;
}
.cname {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.3;
}

.tags {
  display: flex; gap: 4px; flex-wrap: wrap;
  margin-bottom: 8px;
}
.tag {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 100px;
  font-family: 'DM Mono', monospace;
  letter-spacing: .03em;
}
.tag-ui      { background: var(--blue-dim);   color: var(--blue); }
.tag-ux      { background: var(--teal-dim);   color: var(--teal); }
.tag-fe      { background: var(--purple-dim); color: var(--purple); }
.tag-be      { background: var(--amber-dim);  color: var(--amber); }
.tag-ai      { background: var(--pink-dim);   color: var(--pink); }
.tag-mkt     { background: var(--coral-dim);  color: var(--coral); }
.tag-predict { background: var(--green-dim);  color: var(--green); }
.tag-boost   { background: var(--amber-dim);  color: var(--amber); }
.tag-easy    { background: rgba(22,163,74,.1);   color: #15803d; }
.tag-mid     { background: rgba(180,83,9,.1);    color: #b45309; }
.tag-hard    { background: rgba(194,65,12,.1);   color: #c2410c; }

.cdesc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
  font-weight: 300;
}

/* ── DETAIL ── */
.detail {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.detail.open { display: block; }

.dsec { margin-bottom: 12px; }
.dl {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 4px;
}
.db {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.65;
  font-weight: 300;
}
.db ul { padding-left: 1.1rem; }
.db li { margin-bottom: 2px; }

.code {
  background: #f0efe9;
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 10px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  color: #4a4a5a;
  margin-top: 5px;
  line-height: 1.7;
  overflow-x: auto;
  white-space: pre;
}

.disc-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  padding: 5px 12px;
  border-radius: 7px;
  border: 1px solid var(--border-hover);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  margin-top: 10px;
  font-family: 'Sora', sans-serif;
  transition: all .2s;
}
.disc-btn:hover {
  background: var(--green-dim);
  border-color: var(--green);
  color: var(--green);
}

.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--muted);
  font-size: 13px;
  font-weight: 300;
}

/* ── LEGEND ── */
.legend {
  padding: .75rem 2.5rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
}
.legend-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
}
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="eyebrow">AI Strategy · iGaming Platform</div>
    <h1>點子池 <span>全覽</span></h1>
    <p class="header-sub">平台體驗 · 新客獲取 · 存款提升 · 風控保留 — Angular 技術方向</p>
  </div>
  <div class="stats-row">
    <div class="stat">
      <div class="stat-n" id="sTotal">25</div>
      <div class="stat-l">TOTAL IDEAS</div>
    </div>
    <div class="stat">
      <div class="stat-n" id="sShown">24</div>
      <div class="stat-l">SHOWING</div>
    </div>
    <div class="stat">
      <div class="stat-n">4</div>
      <div class="stat-l">CATEGORIES</div>
    </div>
  </div>
</header>

<div class="toolbar">
  <span class="filter-label">篩選</span>
  <div class="filters">
    <button class="fb f-all on" onclick="fil('all',this)">全部</button>
    <button class="fb f-ui"      onclick="fil('ui',this)">UI</button>
    <button class="fb f-ux"      onclick="fil('ux',this)">UX</button>
    <button class="fb f-fe"      onclick="fil('fe',this)">前端</button>
    <button class="fb f-be"      onclick="fil('be',this)">後端</button>
    <button class="fb f-ai"      onclick="fil('ai',this)">AI 模型</button>
    <button class="fb f-mkt"     onclick="fil('mkt',this)">行銷</button>
    <button class="fb f-predict" onclick="fil('predict',this)">預測存款</button>
    <button class="fb f-boost"   onclick="fil('boost',this)">提升金額</button>
    <button class="fb f-archive" onclick="fil('archive',this)">ARCHIVE</button>
  </div>
</div>

<main id="main"></main>

<div class="legend">
  <div class="legend-item"><div class="legend-dot" style="background:var(--pink)"></div>新加入點子</div>
  <div class="legend-item"><div class="legend-dot" style="background:#15803d"></div>低複雜度</div>
  <div class="legend-item"><div class="legend-dot" style="background:#b45309"></div>中複雜度</div>
  <div class="legend-item"><div class="legend-dot" style="background:#c2410c"></div>高複雜度</div>
</div>

<script>
const CATS = [
  { key:'platform',    label:'平台體驗 — 個人化與預測', accent:'var(--blue)' },
  { key:'acquisition', label:'新客獲取 — Landing Page 到首次存款', accent:'var(--coral)' },
  { key:'deposit',     label:'存款提升 — 預測與轉換', accent:'var(--green)' },
  { key:'risk',        label:'風控與保留 — 流失與異常', accent:'var(--amber)' },
  { key:'archive',     label:'ARCHIVE', accent:'#6b6b6b' },
];

const ALL = [
  // ── PLATFORM ──
  {id:'p1',cat:'platform',isNew:false,name:'首頁動態排版',ico:'≡',icoBg:'var(--blue-dim)',accentColor:'var(--blue)',
   types:['ui','fe','be'],diff:'mid',
   desc:'首頁模組順序由後端 AI 排序結果驅動，Angular 動態渲染，不再寫死版型。',
   why:'動態排版在 CTR 上持續優於固定版型，核心是讓首頁結構本身就是個人化的。',
   angular:['LayoutService 取 moduleOrder[] 存入 Signal','@for + trackBy 依序渲染不寫死','Angular Animation 做位移動畫'],
   code:`moduleOrder = signal<string[]>([]);
fetchLayout() {
  this.http.get<string[]>('/api/layout/user')
    .subscribe(o => this.moduleOrder.set(o));
}`,
   predict:'首頁結構本身就是預測結果，用戶不需滾動就能找到想看的區塊。',
   api:'GET /api/layout/user → string[]'},

  {id:'p2',cat:'platform',isNew:false,name:'AI 推薦區塊（三層混合）',ico:'✦',icoBg:'var(--purple-dim)',accentColor:'var(--purple)',
   types:['ux','fe','be','ai'],diff:'hard',
   desc:'「為你推薦」從後端拿 Played / Similar / Trending 三層結果合併渲染，附來源標籤。',
   why:'三層混搭讓推薦兼顧個人化與新鮮感，避免同溫層效應。',
   angular:['forkJoin 同時打三支 API','卡片帶 source badge（因為你玩過 / 熱門中）','Skeleton loading 避免版面跳動'],
   code:`return forkJoin({
  played:   this.http.get('/api/rec/played'),
  similar:  this.http.get('/api/rec/similar'),
  trending: this.http.get('/api/rec/trending')
});`,
   predict:'每次進 app AI 已根據最近行為預備好內容。',
   api:'GET /api/rec/played, /similar, /trending'},

  {id:'p3',cat:'archive',isNew:false,name:'導覽選單個人化排序',ico:'☰',icoBg:'var(--teal-dim)',accentColor:'var(--teal)',
   types:['ux','fe','be'],diff:'mid',
   desc:'NavBar 分類順序從用戶偏好分數動態渲染，新用戶走熱門排序，行為累積後漸進個人化。',
   why:'選單重排能明顯提升常用功能的可達性，降低操作步驟數。',
   angular:['UserPreferenceService 取 categoryOrder Signal','@for 渲染不寫死 nav item 陣列','新用戶 fallback 全站熱門排序','OnPush ChangeDetection 減少重繪'],
   code:`categories = computed(() =>
  this.prefSvc.categoryOrder()
  ?? this.prefSvc.globalDefault());`,
   predict:'最常去的頁面自然靠近拇指熱區，減少尋找時間。',
   api:'GET /api/user/nav-order → CategoryItem[]'},

  {id:'p4',cat:'deposit',isNew:false,name:'存款金額智慧預設',ico:'◎',icoBg:'var(--teal-dim)',accentColor:'var(--teal)',
   types:['ux','fe','be'],diff:'mid',
   desc:'金額快捷按鈕從後端取個人化預設值，不寫死，讓輸入行為更直覺。',
   why:'個人化預設讓用戶少一個輸入動作，與歷史習慣一致。',
   angular:['AmountPresetComponent @Input presets:number[]','BettingService 開面板時 call API','presets 快取 SessionStorage 同 session 不重複 fetch'],
   code:`presets = signal<number[]>([]);
ngOnInit() {
  this.bettingSvc.getPresets()
    .subscribe(p => this.presets.set(p));
}`,
   predict:'系統記得習慣金額，下次開面板就已備好選項。',
   api:'GET /api/user/amount-presets → number[]'},

  {id:'p5',cat:'platform',isNew:false,name:'熱門趨勢提前標籤',ico:'↑',icoBg:'var(--teal-dim)',accentColor:'var(--teal)',
   types:['ui','fe','ai'],diff:'easy',
   desc:'後端根據近期互動數據即時計算 Provider 與 Game 的熱門程度，前端依此動態調整排列順序，最熱門的自動排到最前面，無標籤、無數字，順序本身就是答案。',
   why:'玩家不需要看到排名數字，只要熱門的自然出現在眼前就夠了。動態排序比靜態順序更能反映當下趨勢，也不會讓畫面過於雜亂。',
   angular:['ProviderList / GameList 從後端取已排序的陣列，不寫死順序','@for + trackBy 確保排序變動時只更新位移，不重繪卡片','Angular Animation 讓位置變動有平滑過渡','可搭配 polling 或 SSE 定期更新排序'],
   code:`providerList = signal<Provider[]>([]);

ngOnInit() {
  this.http.get<Provider[]>('/api/providers/ranked')
    .subscribe(list => this.providerList.set(list));
}`,
   predict:'熱門的 Provider 和 Game 自然出現在最顯眼的位置，玩家不需思考就能找到當下最夯的選擇。',
   api:'GET /api/providers/ranked → Provider[]（已依熱度排序）/ GET /api/games/ranked → Game[]'},

  {id:'p6',cat:'platform',isNew:false,name:'個人化活動配對',ico:'★',icoBg:'var(--pink-dim)',accentColor:'var(--pink)',
   types:['ux','be','ai'],diff:'hard',
   desc:'活動推薦依用戶行為畫像動態配對，前端顯示推薦理由，提升點擊意願。',
   why:'全站廣播 CTR 遠低於個人化推薦，推薦理由更能建立信任。',
   angular:['PromoCard @Input reason 欄位渲染說明','PromotionService 取 /api/promo/personalized','IntersectionObserver 曝光追蹤回傳後端'],
   code:`@Input() promo!: {
  title: string;
  reason: string; // '根據你的常玩類型'
  cta: string;
};`,
   predict:'用戶看到的活動是系統預測他現在最感興趣的。',
   api:'GET /api/promo/personalized → Promo[]（含 reason）'},

  {id:'p7',cat:'archive',isNew:false,name:'情境式 AI 客服',ico:'◈',icoBg:'var(--blue-dim)',accentColor:'var(--blue)',
   types:['ui','ux','fe','ai'],diff:'mid',
   desc:'嵌入式 AI 助手知道用戶在哪個頁面、做了什麼，給出情境對應的操作建議。',
   why:'用戶卡關時最需要的是「這一步怎麼做」的即時引導，不是通用說明頁。',
   angular:['ChatWidget 讀取 RouterService 取當前 route context','call API 時帶 currentPage / lastAction','CDK Overlay 浮動 chat 面板不影響 layout'],
   code:`sendMessage(text: string) {
  const ctx = {
    page: this.router.url,
    lastAction: this.actSvc.lastAction()
  };
  this.chatSvc.ask(text, ctx).subscribe(...);
}`,
   predict:'AI 知道此刻在做什麼，主動說出最相關的下一步。',
   api:'POST /api/chat → { reply }（後端帶 context 給 LLM）'},

  // ── ACQUISITION ──
  {id:'a1',cat:'acquisition',isNew:true,name:'Landing Page 意圖偵測',ico:'⊙',icoBg:'var(--coral-dim)',accentColor:'var(--coral)',
   types:['mkt','fe','be','ai'],diff:'mid',
   desc:'AI 從 UTM 參數 + 瀏覽行為推斷訪客偏好（Sports / Casino / General），動態調整 LP 內容。',
   why:'同一廣告受眾裡有不同偏好，AI 在第一秒就分流，提升後續轉換率。',
   angular:['LP standalone component 讀 queryParams 取 UTM','IntentService 計算 intentScore → Signal','@switch 切換 SportsHero / CasinoHero / GenericHero','IntersectionObserver 追蹤看過哪些 section'],
   code:`detectIntent(params: Params, scroll: ScrollEvent[]): Intent {
  const utmHint = params['utm_content'];
  const seen = scroll.filter(s => s.ratio > 0.5)
                     .map(s => s.section);
  return this.scoreIntent(utmHint, seen);
}`,
   predict:'用戶在 LP 停留幾秒，系統已知要給他 Sports 還是 Casino offer。',
   api:'POST /api/intent/lp → { intent, confidence }'},

  {id:'a2',cat:'acquisition',isNew:true,name:'AI 精簡註冊流程',ico:'✎',icoBg:'var(--purple-dim)',accentColor:'var(--purple)',
   types:['ux','fe','be','ai'],diff:'hard',
   desc:'根據來源與意圖動態決定表單欄位和順序，最短路徑完成註冊。',
   why:'每多一個欄位都會流失用戶，AI 判斷哪些可先省略、稍後補填。',
   angular:['RegisterForm fields 從後端動態取，不寫死','Reactive Forms + 動態 FormControl 建構','依 intent 預填部分欄位','Progressive disclosure：必填先、KYC 最後'],
   code:`formConfig$ = this.regSvc.getFormConfig(
  this.intentSvc.current()

const DIFF_L = {easy:'低複雜',mid:'中複雜',hard:'高複雜'};
const DIFF_C = {easy:'tag-easy',mid:'tag-mid',hard:'tag-hard'};
const TYPE_L = {ui:'UI',ux:'UX',fe:'前端',be:'後端',ai:'AI 模型',mkt:'行銷',predict:'預測存款',boost:'提升金額'};

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function cardHTML(d){
  const tags = d.types.map(t=>`<span class="tag tag-${t}">${TYPE_L[t]||t}</span>`).join('')
    + `<span class="tag ${DIFF_C[d.diff]}">${DIFF_L[d.diff]}</span>`;
  return `<div class="card" id="card-${d.id}" onclick="tog('${d.id}')" style="--accent-color:${d.accentColor}">
    ${d.isNew ? '<div class="new-dot"></div>' : ''}
    <div class="ctop">
      <div class="cico" style="background:${d.icoBg};color:${d.accentColor}">${d.ico}</div>
      <div class="cname">${d.name}</div>
    </div>
    <div class="tags">${tags}</div>
    <div class="cdesc">${d.desc}</div>
    <div class="detail" id="det-${d.id}">
      <div class="dsec"><div class="dl">為什麼做</div><div class="db">${d.why}</div></div>
      <div class="dsec"><div class="dl">Angular 切入點</div><div class="db"><ul>${d.angular.map(a=>`<li>${a}</li>`).join('')}</ul></div></div>
      <div class="dsec"><div class="dl">程式碼方向</div><div class="code">${esc(d.code)}</div></div>
      <div class="dsec"><div class="dl">預測 / 介入邏輯</div><div class="db">${d.predict}</div></div>
      <div class="dsec"><div class="dl">API 設計</div><div class="db">${d.api}</div></div>
    </div>
  </div>`;
}

function render(f) {
  const main = document.getElementById('main');
  const filtered = f === 'all' ? ALL.filter(d => d.cat !== 'archive') : f === 'archive' ? ALL.filter(d => d.cat === 'archive') : ALL.filter(d => d.types.includes(f) && d.cat !== 'archive');
  let html = '';
  let shown = 0;
  CATS.forEach(cat => {
    const items = filtered.filter(d => d.cat === cat.key);
    if (!items.length) return;
    shown += items.length;
    html += `<section class="section">
      <div class="section-header">
        <div class="section-title">${cat.label}</div>
        <div class="section-line"></div>
        <div class="section-count">${items.length} ideas</div>
      </div>
      <div class="grid">${items.map(cardHTML).join('')}</div>
    </section>`;
  });
  if (!shown) html = '<div class="empty-state">沒有符合篩選條件的點子</div>';
  main.innerHTML = html;
  document.getElementById('sShown').textContent = shown;
}

function fil(f, btn) {
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render(f);
}

function tog(id) {
  const card = document.getElementById('card-' + id);
  const det = document.getElementById('det-' + id);
  const was = det.classList.contains('open');
  document.querySelectorAll('.detail').forEach(x => x.classList.remove('open'));
  document.querySelectorAll('.card').forEach(x => x.classList.remove('open'));
  if (!was) { det.classList.add('open'); card.classList.add('open'); }
}

render('all');
</script>

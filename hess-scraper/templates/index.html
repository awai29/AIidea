<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Hippo eSchool</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root {
  --bg:#121212; --bg-card:#1e1e1e; --bg-item:#282828; --bg-hover:#333;
  --border:#333; --border-hi:#444;
  --primary:#06B6D4; --primary-hi:#0891B2;
  --text-1:#fff; --text-2:#B3B3B3; --text-3:#666;
  --danger:#EF4444;
  --sidebar-w:220px; --topbar-h:56px; --player-h:80px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text-2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:14px;line-height:1.5;height:100dvh;overflow:hidden;display:flex;flex-direction:column;}
a{text-decoration:none;color:inherit;}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit;}
input{font-family:inherit;}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}

/* TOPBAR */
#topbar{height:var(--topbar-h);background:#1a1a1a;border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0;z-index:30;}
#acc-tabs{display:flex;align-items:center;gap:6px;flex:1;overflow-x:auto;padding:0 8px;}
#add-acc-btn{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--border-hi);
  display:flex;align-items:center;justify-content:center;color:var(--text-3);flex-shrink:0;transition:all .15s;}
#add-acc-btn:hover{border-color:var(--primary);color:var(--primary);}
.acc-tab{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 8px;border-radius:8px;
  border:1px solid transparent;white-space:nowrap;flex-shrink:0;font-size:13px;font-weight:500;
  color:var(--text-3);transition:all .15s;cursor:pointer;}
.acc-tab:hover{background:var(--bg-hover);color:var(--text-2);}
.acc-tab.active{background:rgba(6,182,212,0.12);border-color:rgba(6,182,212,0.3);color:var(--primary);}
.acc-avatar{width:22px;height:22px;border-radius:6px;background:rgba(6,182,212,0.15);
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;
  color:var(--primary);flex-shrink:0;}
.acc-tab.active .acc-avatar{background:var(--primary);color:#fff;}

/* LAYOUT */
#layout{display:flex;flex:1;overflow:hidden;}
#sidebar{width:var(--sidebar-w);background:#121212;border-right:1px solid var(--border);
  display:flex;flex-direction:column;flex-shrink:0;}
#sidebar-bottom{padding:12px;border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;gap:6px;}
#wizard-btn{width:100%;padding:9px 12px;border-radius:8px;border:1px dashed var(--border-hi);
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);transition:all .15s;}
#wizard-btn:hover{border-color:var(--primary);color:var(--primary);}
#log-toggle-btn{width:100%;padding:7px 12px;border-radius:8px;display:flex;align-items:center;gap:8px;
  font-size:12px;color:var(--text-3);transition:color .15s;}
#log-toggle-btn:hover{color:var(--text-2);}
#log-err-dot{width:7px;height:7px;border-radius:50%;background:var(--danger);display:none;margin-left:auto;}
#main{flex:1;overflow-y:auto;background:var(--bg);padding-bottom:var(--player-h);}
@media(max-width:768px){
  #sidebar{display:none;}
  #layout{flex-direction:column;}
  #main{padding-bottom:calc(var(--player-h) + 60px);}
}
#mobile-lesson-list{display:none;flex-direction:column;padding:4px 12px 12px;}
@media(max-width:768px){#mobile-lesson-list{display:flex;}}
#mobile-back-btn{display:none;align-items:center;gap:6px;padding:4px 0 12px;font-size:12px;color:var(--text-3);transition:color .15s;}
#mobile-back-btn:hover{color:var(--text-1);}
@media(max-width:768px){#mobile-back-btn{display:flex;}}

/* SIDEBAR CONTENT */
#sidebar-content{flex:1;overflow-y:auto;display:flex;flex-direction:column;}
#search-wrap{padding:8px 12px;border-bottom:1px solid var(--border);position:relative;flex-shrink:0;}
.search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none;}
#search-input{width:100%;background:rgba(255,255,255,0.06);border:1px solid transparent;border-radius:6px;
  padding:6px 10px 6px 28px;font-size:12px;color:var(--text-1);outline:none;transition:border .15s;}
#search-input::placeholder{color:var(--text-3);}
#search-input:focus{border-color:rgba(6,182,212,0.4);}
#course-tabs{display:flex;gap:4px;padding:8px 12px;flex-wrap:wrap;flex-shrink:0;}
.ctab{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;color:var(--text-3);
  border:1px solid transparent;cursor:pointer;transition:all .15s;}
.ctab:hover{background:var(--bg-hover);color:var(--text-2);}
.ctab.active{background:rgba(6,182,212,0.15);border-color:rgba(6,182,212,0.3);color:var(--primary);}
#lesson-list{padding:4px 8px 8px;overflow-y:auto;}
.lesson-group-label{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;
  letter-spacing:0.08em;padding:10px 6px 4px;}
.lesson-row{display:flex;align-items:center;gap:8px;padding:8px;border-radius:6px;cursor:pointer;
  transition:background .12s;border-left:2px solid transparent;}
.lesson-row:hover{background:var(--bg-hover);}
.lesson-row.active{background:rgba(6,182,212,0.08);border-left-color:var(--primary);}
.lesson-name{flex:1;font-size:13px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.lesson-row.active .lesson-name{color:var(--text-1);font-weight:600;}
.lesson-badge{font-size:11px;color:var(--text-3);flex-shrink:0;}
.lesson-row.active .lesson-badge{color:var(--primary);}

/* MOBILE COURSE TABS */
#mobile-course-tabs{display:none;gap:6px;padding:8px 12px;overflow-x:auto;background:#1a1a1a;
  border-bottom:1px solid var(--border);flex-shrink:0;}
@media(max-width:768px){#mobile-course-tabs{display:flex;}}
.mobile-ctab{padding:5px 14px;border-radius:16px;background:var(--bg-item);font-size:12px;
  color:var(--text-2);white-space:nowrap;flex-shrink:0;transition:all .15s;}
.mobile-ctab.active{background:var(--primary);color:#fff;}

/* MAIN CONTENT */
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:calc(100vh - var(--topbar-h) - var(--player-h));text-align:center;padding:48px;}
.welcome-icon{width:72px;height:72px;border-radius:20px;background:rgba(6,182,212,0.1);
  display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.welcome-title{font-size:18px;font-weight:700;color:var(--text-1);margin-bottom:8px;}
.welcome-sub{font-size:13px;color:var(--text-3);max-width:240px;line-height:1.6;margin-bottom:20px;}
.welcome-cta{padding:10px 20px;border-radius:24px;border:1px solid var(--border-hi);
  font-size:13px;color:var(--text-2);transition:all .15s;}
.welcome-cta:hover{border-color:var(--primary);color:var(--primary);}

#scraping-banner{margin:20px;padding:16px;border-radius:12px;
  background:rgba(6,182,212,0.06);border:1px solid rgba(6,182,212,0.2);display:none;}
#scraping-text{font-size:13px;color:var(--primary);margin-bottom:8px;}
#scraping-bar-bg{height:4px;background:var(--bg-item);border-radius:2px;overflow:hidden;}
#scraping-bar-fill{height:100%;background:var(--primary);border-radius:2px;width:0%;transition:width .35s;}

#content-header{position:relative;padding:20px 20px 0;display:none;}
.content-gradient{position:absolute;top:0;left:0;right:0;height:180px;
  background:linear-gradient(180deg,rgba(6,182,212,0.15) 0%,transparent 100%);pointer-events:none;}
.content-header-inner{position:relative;margin-bottom:12px;}
#cv-title{font-size:22px;font-weight:700;color:var(--text-1);margin-bottom:4px;}
#cv-meta{font-size:13px;color:var(--text-3);}
.content-actions{display:flex;gap:10px;padding-bottom:16px;position:relative;}
#play-all-btn{display:none;align-items:center;gap:6px;padding:8px 18px;border-radius:24px;
  background:var(--primary);color:#fff;font-size:13px;font-weight:600;transition:background .15s;}
#play-all-btn:hover{background:var(--primary-hi);}

.section-label{font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;
  letter-spacing:0.08em;padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--border);}
#tracks-section{padding:0 20px 8px;display:none;}
#links-section{padding:0 20px 24px;display:none;}
#track-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
.track-card{background:var(--bg-card);border-radius:10px;padding:12px;cursor:pointer;
  transition:background .15s;position:relative;}
.track-card:hover{background:var(--bg-hover);}
.track-card.playing{background:rgba(6,182,212,0.1);}
.track-card.locked{opacity:.5;cursor:default;}
.track-card.locked:hover{background:var(--bg-card);}
.card-art{width:100%;aspect-ratio:1;background:var(--bg-item);border-radius:8px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;color:var(--text-3);overflow:hidden;position:relative;}
.card-art img{width:100%;height:100%;object-fit:cover;}
.card-play-overlay{position:absolute;inset:0;border-radius:8px;background:rgba(0,0,0,0.4);
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;}
.track-card:not(.locked):hover .card-play-overlay,.track-card.playing .card-play-overlay{opacity:1;}
.play-circle{width:40px;height:40px;border-radius:50%;background:var(--primary);
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.card-title{font-size:13px;font-weight:600;color:var(--text-1);margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-sub{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lock-overlay{position:absolute;inset:0;border-radius:8px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;color:var(--text-3);}
.eq{display:flex;align-items:flex-end;gap:2px;height:16px;}
@keyframes e1{0%,100%{height:4px}40%{height:14px}}
@keyframes e2{0%,100%{height:14px}40%{height:4px}}
@keyframes e3{0%,100%{height:8px}40%{height:16px}}
.eq span{width:3px;border-radius:2px;background:#fff;display:block;}
.eq span:nth-child(1){animation:e1 .7s ease-in-out infinite;}
.eq span:nth-child(2){animation:e2 .8s ease-in-out infinite;}
.eq span:nth-child(3){animation:e3 .65s ease-in-out infinite;}

.link-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-card);
  border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:6px;}
.link-row:hover{background:var(--bg-hover);}
.link-icon{width:36px;height:36px;border-radius:8px;background:var(--bg-item);
  display:flex;align-items:center;justify-content:center;color:var(--text-3);flex-shrink:0;}
.link-name{font-size:13px;color:var(--text-1);font-weight:500;}
.link-type{font-size:11px;color:var(--text-3);margin-top:3px;}
.meta-pill{display:inline-flex;align-items:center;gap:4px;margin-right:8px;}

/* PLAYER BAR */
#player-bar{position:fixed;bottom:0;left:0;right:0;height:var(--player-h);
  background:rgba(24,24,24,0.98);backdrop-filter:blur(24px);border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;z-index:50;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);}
#player-bar.up{transform:translateY(0);}
#np-info{display:flex;align-items:center;gap:12px;width:220px;flex-shrink:0;cursor:pointer;min-width:0;}
#np-art{width:48px;height:48px;border-radius:6px;overflow:hidden;background:var(--bg-item);flex-shrink:0;}
#np-art img{width:100%;height:100%;object-fit:cover;}
#np-art-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-3);}
#np-text{min-width:0;}
#np-title{font-size:13px;font-weight:600;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#np-lesson{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;}
#player-controls{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;}
.ctrl-btns{display:flex;align-items:center;gap:14px;}
.ctrl-btn{color:var(--text-3);transition:color .15s;padding:4px;}
.ctrl-btn:hover{color:var(--text-1);}
.ctrl-btn.on{color:var(--primary);}
#play-pause-btn{width:36px;height:36px;border-radius:50%;background:var(--text-1);
  display:flex;align-items:center;justify-content:center;transition:transform .1s;}
#play-pause-btn svg{color:#000;}
#play-pause-btn:hover{transform:scale(1.06);}
.seek-row{display:flex;align-items:center;gap:8px;width:100%;max-width:480px;}
.time-label{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;width:32px;}
.time-label.right{text-align:right;}
#seek{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;cursor:pointer;outline:none;background:transparent;}
#seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--p,0%),var(--bg-hover) var(--p,0%));}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
  background:#fff;margin-top:-4px;opacity:0;transition:opacity .15s;}
#seek:hover::-webkit-slider-thumb{opacity:1;}
#vol-wrap{display:flex;align-items:center;gap:8px;width:160px;flex-shrink:0;justify-content:flex-end;}
#vol-btn{color:var(--text-3);transition:color .15s;}
#vol-btn:hover{color:var(--text-1);}
#vol{width:80px;-webkit-appearance:none;height:4px;border-radius:2px;cursor:pointer;
  accent-color:var(--primary);background:var(--bg-hover);}
#queue-btn{color:var(--text-3);transition:color .15s;padding:4px;}
#queue-btn:hover,#queue-btn.active{color:var(--primary);}
@media(max-width:768px){
  #np-info{width:auto;flex:1;}
  #vol-wrap{display:none;}
  .ctrl-btn#shuffle-btn,.ctrl-btn#repeat-btn{display:none;}
  #player-controls{flex:none;}
  #player-bar{padding:0 12px;gap:12px;}
  .seek-row{display:none;}
}

/* NOW PLAYING SCREEN */
#now-playing-screen{display:none;position:fixed;inset:0;z-index:80;
  background:linear-gradient(180deg,#1a2a33 0%,#121212 60%);
  flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
#now-playing-screen.open{display:flex;}
#nps-header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 20px;flex-shrink:0;}
#nps-course{font-size:12px;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;}
#nps-down{color:var(--text-2);}
#nps-art-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px 40px;width:100%;}
#nps-art{width:100%;max-width:320px;aspect-ratio:1;background:var(--bg-item);border-radius:16px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
#nps-art img{width:100%;height:100%;object-fit:cover;}
#nps-info{width:100%;padding:0 28px;margin-bottom:16px;}
#nps-title{font-size:20px;font-weight:700;color:var(--text-1);margin-bottom:4px;}
#nps-sub{font-size:14px;color:var(--text-3);}
#nps-seek-wrap{width:100%;padding:0 28px;margin-bottom:16px;}
#nps-seek{width:100%;-webkit-appearance:none;height:4px;border-radius:2px;cursor:pointer;outline:none;background:transparent;margin-bottom:6px;}
#nps-seek::-webkit-slider-runnable-track{height:4px;border-radius:2px;
  background:linear-gradient(to right,var(--primary) var(--p,0%),var(--bg-hover) var(--p,0%));}
#nps-seek::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:#fff;margin-top:-5px;}
.nps-times{display:flex;justify-content:space-between;font-size:11px;color:var(--text-3);}
#nps-controls{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 24px 24px;}
.nps-btn{color:var(--text-2);padding:8px;transition:color .15s;}
.nps-btn:hover,.nps-btn.on{color:var(--primary);}
#nps-play-btn{width:60px;height:60px;border-radius:50%;background:var(--primary);
  display:flex;align-items:center;justify-content:center;transition:transform .1s;}
#nps-play-btn:hover{transform:scale(1.05);}
#nps-play-btn svg{color:#fff;}

/* QUEUE PANEL */
#queue-panel{display:none;position:fixed;bottom:var(--player-h);right:0;width:300px;
  background:#181818;border:1px solid var(--border);border-radius:8px 8px 0 0;
  max-height:400px;z-index:60;flex-direction:column;overflow:hidden;}
#queue-panel.open{display:flex;}
.queue-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#queue-list{overflow-y:auto;flex:1;}
.queue-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:background .12s;}
.queue-item:hover{background:var(--bg-hover);}
.queue-item.current{background:rgba(6,182,212,0.08);}
.queue-thumb{width:36px;height:36px;border-radius:4px;background:var(--bg-item);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.queue-thumb img{width:100%;height:100%;object-fit:cover;}
.queue-name{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.queue-item.current .queue-name{color:var(--primary);font-weight:600;}
.queue-lesson{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.remove-q-btn{color:var(--text-3);flex-shrink:0;transition:color .15s;padding:2px;}
.remove-q-btn:hover{color:var(--text-1);}

/* VIDEO MODAL */
#video-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);
  z-index:90;align-items:center;justify-content:center;}
#video-modal.show{display:flex;}
#video-wrap{position:relative;max-width:900px;width:100%;padding:0 16px;}
#video-el{width:100%;border-radius:12px;background:#000;}
#video-title-bar{display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;color:var(--text-2);font-size:13px;}
#video-close-btn{color:var(--text-3);transition:color .15s;}
#video-close-btn:hover{color:var(--text-1);}

/* LOG PANEL */
#log-panel{display:none;position:fixed;bottom:var(--player-h);left:0;right:0;
  background:rgba(10,10,10,0.98);border-top:1px solid var(--border);max-height:260px;z-index:60;}
#log-panel.show{display:block;}
.log-header{display:flex;align-items:center;justify-content:space-between;
  padding:8px 16px;border-bottom:1px solid var(--border);}
.log-header-title{font-size:12px;font-weight:600;color:var(--text-3);font-family:monospace;}
.log-copy-btn{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.07);
  color:var(--text-3);font-size:11px;transition:background .15s;}
.log-copy-btn:hover{background:rgba(255,255,255,.12);}
.log-close-btn{color:var(--text-3);transition:color .15s;}
.log-close-btn:hover{color:var(--text-1);}
#log-content{overflow-y:auto;padding:8px 16px;max-height:200px;
  font-size:11px;color:#4ADE80;font-family:monospace;line-height:1.6;}

/* ADD MODAL */
#add-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);
  backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center;}
#add-modal.show{display:flex;}
.modal-card{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:24px;width:340px;}
.modal-title{font-size:16px;font-weight:700;color:var(--text-1);margin-bottom:20px;}
.field-wrap{display:flex;flex-direction:column;gap:14px;}
.field label{display:block;font-size:11px;font-weight:700;color:var(--text-3);
  letter-spacing:0.06em;text-transform:uppercase;margin-bottom:5px;}
.field input{width:100%;background:var(--bg-item);border:1px solid var(--border);
  border-radius:8px;padding:9px 12px;font-size:13px;color:var(--text-1);outline:none;transition:border .15s;}
.field input::placeholder{color:var(--text-3);}
.field input:focus{border-color:rgba(6,182,212,0.5);}
.modal-btns{display:flex;gap:10px;margin-top:20px;}
.btn-ghost{flex:1;padding:10px;border-radius:8px;font-size:13px;color:var(--text-2);
  border:1px solid var(--border);transition:all .15s;}
.btn-ghost:hover{border-color:var(--border-hi);color:var(--text-1);}
.btn-primary{flex:1;padding:10px;border-radius:8px;font-size:13px;font-weight:600;
  background:var(--primary);color:#fff;transition:background .15s;}
.btn-primary:hover{background:var(--primary-hi);}
#add-err{font-size:12px;color:var(--danger);display:none;margin-top:8px;}

/* WIZARD OVERLAY */
#wizard-overlay{display:none;position:fixed;inset:0;z-index:90;background:rgba(0,0,0,0.8);
  backdrop-filter:blur(8px);align-items:center;justify-content:center;padding:20px;}
#wizard-overlay.open{display:flex;}
#wizard-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:560px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
#wizard-header{display:flex;align-items:center;justify-content:space-between;
  padding:18px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
#wizard-title{font-size:16px;font-weight:700;color:var(--text-1);}
#wizard-header button{color:var(--text-3);transition:color .15s;}
#wizard-header button:hover{color:var(--text-1);}
#wizard-steps{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);flex-shrink:0;}
.wz-step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);font-weight:600;}
.wz-step span{width:24px;height:24px;border-radius:50%;background:var(--bg-item);
  border:1.5px solid var(--border-hi);display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--text-3);}
.wz-step.active span{background:var(--primary);border-color:var(--primary);color:#fff;}
.wz-step.active{color:var(--primary);}
.wz-step.done span{background:var(--bg-hover);border-color:#555;color:var(--text-2);}
.wz-connector{flex:1;height:1px;background:var(--border);margin:0 8px;}
#wizard-body{flex:1;overflow-y:auto;padding:20px;}
.wz-section-title{font-size:16px;font-weight:700;color:var(--text-1);margin-bottom:6px;}
.wz-section-sub{font-size:13px;color:var(--text-3);margin-bottom:20px;line-height:1.6;}
.wz-acc-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-item);
  border-radius:8px;border:1px solid var(--border);margin-bottom:8px;}
.wz-acc-avatar{width:36px;height:36px;border-radius:8px;background:var(--bg-hover);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;
  color:var(--primary);flex-shrink:0;}
.wz-acc-name{font-size:13px;font-weight:600;color:var(--text-1);}
.wz-acc-sub{font-size:11px;color:var(--text-3);margin-top:2px;}
.wz-progress-bg{height:4px;background:var(--bg-hover);border-radius:2px;margin-top:8px;overflow:hidden;}
.wz-progress-fill{height:100%;background:var(--primary);border-radius:2px;transition:width .35s;width:0%;}
.wz-stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.wz-stat{background:var(--bg-item);border-radius:8px;padding:12px;text-align:center;}
.wz-stat-num{font-size:20px;font-weight:700;color:var(--text-1);}
.wz-stat-label{font-size:10px;color:var(--text-3);margin-top:2px;}
#wizard-footer{display:flex;align-items:center;padding:14px 20px;border-top:1px solid var(--border);flex-shrink:0;}
#wz-back{font-size:13px;color:var(--text-3);padding:8px 0;transition:color .15s;}
#wz-back:hover{color:var(--text-1);}
#wz-next{padding:10px 24px;border-radius:24px;background:var(--primary);
  color:#fff;font-size:13px;font-weight:700;transition:background .15s;}
#wz-next:hover{background:var(--primary-hi);}
#wz-next:disabled{opacity:0.4;cursor:not-allowed;}

/* BACKUP MODAL (kept for compatibility) */
#backup-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);
  backdrop-filter:blur(8px);z-index:95;align-items:center;justify-content:center;padding:20px;}
.bk-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:560px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;}
.bk-hdr{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.bk-hdr-left{display:flex;align-items:center;gap:10px;}
.bk-icon{width:32px;height:32px;border-radius:9px;background:rgba(6,182,212,.12);display:flex;align-items:center;justify-content:center;}
#bk-title{font-size:14px;font-weight:600;color:var(--text-1);}
#bk-sub{font-size:11px;color:var(--text-3);}
.bk-close-btn{color:var(--text-3);transition:color .15s;}
.bk-close-btn:hover{color:var(--text-1);}
#bk-body{flex:1;overflow-y:auto;padding:16px 20px;}
#bk-list label{display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 0 5px 8px;border-radius:6px;transition:background .12s;}
#bk-list label:hover{background:var(--bg-hover);}
.bk-course-hdr{display:flex;align-items:center;gap:8px;cursor:pointer;padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:6px;}
.bk-check{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--border-hi);
  background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.bk-check.on{background:var(--primary);border-color:var(--primary);}
#bk-prog-bar-bg{height:4px;background:var(--bg-hover);border-radius:2px;overflow:hidden;}
#bk-prog-bar{height:100%;background:var(--primary);border-radius:2px;width:0%;transition:width .3s;}
#bk-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;flex-shrink:0;}

@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- TOPBAR -->
<header id="topbar">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2" style="flex-shrink:0">
    <path d="M9 19V6l12-3v13M9 19c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2zm12-3c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2zM9 10l12-3"/>
  </svg>
  <div id="acc-tabs"></div>
  <button id="add-acc-btn" onclick="openAddModal()" aria-label="新增帳號">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>

<!-- LAYOUT -->
<div id="layout">
  <!-- Mobile course tabs -->
  <div id="mobile-course-tabs"></div>

  <!-- Sidebar -->
  <nav id="sidebar">
    <div id="sidebar-content">
      <div id="search-wrap">
        <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="search-input" type="search" placeholder="搜尋課次..." oninput="filterLessons()" aria-label="搜尋課次"/>
      </div>
      <div id="course-tabs"></div>
      <div id="lesson-list" role="list" aria-label="課次列表"></div>
    </div>
    <div id="sidebar-bottom">
      <button id="wizard-btn" onclick="openWizard()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        新學期 / 備份
      </button>
      <button id="log-toggle-btn" onclick="toggleLog()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h7"/></svg>
        抓取記錄
        <span id="log-err-dot"></span>
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main id="main">
    <div id="scraping-banner">
      <div id="scraping-text">正在抓取中...</div>
      <div id="scraping-bar-bg"><div id="scraping-bar-fill"></div></div>
    </div>

    <div id="welcome">
      <div class="welcome-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.5">
          <path d="M9 19V6l12-3v13M9 19c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2zm12-3c0 1.1-1.34 2-3 2s-3-.9-3-2 1.34-2 3-2 3 .9 3 2zM9 10l12-3"/>
        </svg>
      </div>
      <h1 class="welcome-title">選擇課次，開始聆聽</h1>
      <p class="welcome-sub" id="welcome-sub-text">從左側選擇課次 · 已備份的點擊即可播放</p>
      <button class="welcome-cta" onclick="openWizard()">首次使用？點此新增帳號並備份</button>
    </div>

    <!-- 手機版課次列表（sidebar 隱藏時用） -->
    <div id="mobile-lesson-list"></div>

    <div id="content-header">
      <div class="content-gradient"></div>
      <div class="content-header-inner">
        <button id="mobile-back-btn" onclick="mobileLessonBack()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          返回課次列表
        </button>
        <h2 id="cv-title"></h2>
        <div id="cv-meta"></div>
      </div>
      <div class="content-actions">
        <button id="play-all-btn" onclick="playAll()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          全部播放
        </button>
      </div>
    </div>

    <div id="tracks-section">
      <div class="section-label">媒體</div>
      <div id="track-grid" role="list"></div>
    </div>

    <div id="links-section">
      <div class="section-label">其他資源</div>
      <div id="link-list" role="list"></div>
    </div>
  </main>
</div>

<!-- PLAYER BAR -->
<div id="player-bar" role="region" aria-label="播放器">
  <div id="np-info" onclick="openNowPlaying()">
    <div id="np-art">
      <div id="np-art-ph">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <img id="np-img" src="" alt="" style="display:none"/>
    </div>
    <div id="np-text">
      <div id="np-title"></div>
      <div id="np-lesson"></div>
    </div>
  </div>
  <div id="player-controls">
    <div class="ctrl-btns">
      <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" aria-label="隨機">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="playerPrev()" aria-label="上一首">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="play-pause-btn" onclick="playerToggle()" aria-label="播放/暫停">
        <svg id="ico-play" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="ico-pause" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="ctrl-btn" onclick="playerNext()" aria-label="下一首">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
      <button class="ctrl-btn" id="repeat-btn" onclick="toggleRepeat()" aria-label="重複">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </div>
    <div class="seek-row">
      <span class="time-label" id="t-cur">0:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1"
        style="--p:0%" oninput="onSeekInput()" onchange="onSeekChange()" aria-label="播放進度"/>
      <span class="time-label right" id="t-dur">0:00</span>
    </div>
  </div>
  <div id="vol-wrap">
    <button id="vol-btn" onclick="toggleMute()" aria-label="靜音">
      <svg id="vol-on" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
      <svg id="vol-off" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
    </button>
    <input type="range" id="vol" min="0" max="1" step="0.01" value="1" oninput="onVolChange()" aria-label="音量"/>
    <button id="queue-btn" onclick="toggleQueuePanel()" aria-label="播放佇列">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 10h11v2H3zm0-4h11v2H3zm0 8h7v2H3zm13-1v8l6-4z"/></svg>
    </button>
  </div>
</div>

<!-- NOW PLAYING FULLSCREEN (mobile) -->
<div id="now-playing-screen" aria-modal="true">
  <div id="nps-header">
    <button id="nps-down" onclick="closeNowPlaying()" aria-label="收起">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div id="nps-course"></div>
    <div style="width:24px"></div>
  </div>
  <div id="nps-art-wrap">
    <div id="nps-art">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" style="color:var(--text-3)"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>
  </div>
  <div id="nps-info">
    <div id="nps-title"></div>
    <div id="nps-sub"></div>
  </div>
  <div id="nps-seek-wrap">
    <input type="range" id="nps-seek" min="0" max="100" value="0" step="0.1"
      style="--p:0%" oninput="onNpsSeekInput()" onchange="onNpsSeekChange()" aria-label="播放進度"/>
    <div class="nps-times"><span id="nps-cur">0:00</span><span id="nps-dur">0:00</span></div>
  </div>
  <div id="nps-controls">
    <button class="nps-btn" id="nps-shuffle" onclick="toggleShuffle()" aria-label="隨機">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
    </button>
    <button class="nps-btn" onclick="playerPrev()" aria-label="上一首">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
    </button>
    <button id="nps-play-btn" onclick="playerToggle()" aria-label="播放/暫停">
      <svg id="nps-ico-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="nps-ico-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>
    <button class="nps-btn" onclick="playerNext()" aria-label="下一首">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
    </button>
    <button class="nps-btn" id="nps-repeat" onclick="toggleRepeat()" aria-label="重複">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
    </button>
  </div>
</div>

<!-- QUEUE PANEL -->
<div id="queue-panel" aria-label="播放佇列">
  <div class="queue-header">
    <span style="font-size:13px;font-weight:600;color:var(--text-1)">播放佇列</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="clearQueue()" style="font-size:11px;color:var(--text-3);padding:3px 8px;border-radius:5px;border:1px solid var(--border);transition:all .15s" onmouseover="this.style.color='var(--text-2)'" onmouseout="this.style.color='var(--text-3)'">清空</button>
      <button onclick="toggleQueuePanel()" style="color:var(--text-3);transition:color .15s" onmouseover="this.style.color='var(--text-1)'" onmouseout="this.style.color='var(--text-3)'">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div id="queue-list"></div>
</div>

<!-- VIDEO MODAL -->
<div id="video-modal" role="dialog" aria-modal="true">
  <div id="video-wrap">
    <video id="video-el" playsinline></video>
    <div id="video-title-bar">
      <span id="video-name-text"></span>
      <button id="video-close-btn" onclick="closeVideoModal()" aria-label="關閉影片">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
</div>

<!-- LOG PANEL -->
<div id="log-panel" role="log">
  <div class="log-header">
    <span class="log-header-title">抓取記錄</span>
    <div style="display:flex;gap:8px;">
      <button class="log-copy-btn" onclick="copyLog()">複製</button>
      <button class="log-close-btn" onclick="toggleLog()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div id="log-content"></div>
</div>

<!-- ADD ACCOUNT MODAL -->
<div id="add-modal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h2 class="modal-title">新增帳號</h2>
    <div class="field-wrap">
      <div class="field">
        <label for="new-label">暱稱（選填）</label>
        <input id="new-label" type="text" placeholder="例：小明"/>
      </div>
      <div class="field">
        <label for="new-username">帳號（學號）</label>
        <input id="new-username" type="text" placeholder="111110436"/>
      </div>
      <div class="field">
        <label for="new-password">密碼</label>
        <input id="new-password" type="password" placeholder="••••••••"/>
      </div>
    </div>
    <p id="add-err" role="alert"></p>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeAddModal()">取消</button>
      <button class="btn-primary" onclick="submitAdd()">新增</button>
    </div>
  </div>
</div>

<!-- WIZARD OVERLAY -->
<div id="wizard-overlay" role="dialog" aria-modal="true" aria-label="新學期設定">
  <div id="wizard-panel">
    <div id="wizard-header">
      <h2 id="wizard-title">新學期設定</h2>
      <button onclick="closeWizard()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="wizard-steps">
      <div class="wz-step" data-step="1"><span>1</span>帳號</div>
      <div class="wz-connector"></div>
      <div class="wz-step" data-step="2"><span>2</span>抓取</div>
      <div class="wz-connector"></div>
      <div class="wz-step" data-step="3"><span>3</span>備份</div>
      <div class="wz-connector"></div>
      <div class="wz-step" data-step="4"><span>4</span>完成</div>
    </div>
    <div id="wizard-body"></div>
    <div id="wizard-footer">
      <button id="wz-back" onclick="wizardBack()" style="display:none">← 上一步</button>
      <div style="flex:1"></div>
      <button id="wz-next" onclick="wizardNext()">下一步 →</button>
    </div>
  </div>
</div>

<!-- BACKUP MODAL -->
<div id="backup-modal" role="dialog" aria-modal="true">
  <div class="bk-panel">
    <div class="bk-hdr">
      <div class="bk-hdr-left">
        <div class="bk-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
        </div>
        <div>
          <div id="bk-title">備份到 Dropbox</div>
          <div id="bk-sub">載入清單中...</div>
        </div>
      </div>
      <button class="bk-close-btn" onclick="closeBackupModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="bk-body">
      <div id="bk-loading" style="text-align:center;padding:40px;color:var(--text-3)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
          style="animation:spin 1s linear infinite;margin:0 auto 12px"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <div>正在載入清單...</div>
      </div>
      <div id="bk-select" style="display:none">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
          <span style="font-size:12px;color:var(--text-3)">選擇要備份的課次</span>
          <div style="display:flex;gap:8px">
            <button onclick="bkSelectAll(true)" style="font-size:11px;color:var(--primary);padding:3px 8px;border-radius:5px;border:1px solid rgba(6,182,212,.3);transition:background .15s" onmouseover="this.style.background='rgba(6,182,212,.1)'" onmouseout="this.style.background='transparent'">全選</button>
            <button onclick="bkSelectAll(false)" style="font-size:11px;color:var(--text-3);padding:3px 8px;border-radius:5px;border:1px solid var(--border);transition:background .15s" onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'">全不選</button>
          </div>
        </div>
        <div id="bk-list"></div>
      </div>
      <div id="bk-progress" style="display:none;padding:8px 0">
        <div style="margin-bottom:20px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
            <span style="color:var(--text-2)" id="bk-prog-label">準備中...</span>
            <span style="color:var(--primary)" id="bk-prog-pct">0%</span>
          </div>
          <div id="bk-prog-bar-bg"><div id="bk-prog-bar"></div></div>
        </div>
        <div style="font-size:12px;color:var(--text-3)" id="bk-prog-detail">0 / 0 項</div>
        <div id="bk-errors" style="margin-top:12px;font-size:11px;color:#EF4444;max-height:80px;overflow-y:auto"></div>
      </div>
      <div id="bk-done" style="display:none;text-align:center;padding:32px 0">
        <div style="width:48px;height:48px;border-radius:14px;background:rgba(6,182,212,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <div style="font-size:15px;font-weight:600;color:var(--text-1);margin-bottom:6px">備份完成！</div>
        <div id="bk-done-detail" style="font-size:12px;color:var(--text-3);line-height:1.7"></div>
      </div>
    </div>
    <div id="bk-footer">
      <button onclick="closeBackupModal()" class="btn-ghost" style="flex:none;padding:8px 16px">取消</button>
      <button id="bk-start-btn" onclick="startBackup()"
        style="display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:9px;
               background:var(--primary);color:#fff;font-size:13px;font-weight:600;
               transition:background .15s;opacity:.4;cursor:not-allowed" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
        開始備份
      </button>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
/* ═══════════════════════════════════════
   STATE
═══════════════════════════════════════ */
let accounts = [], currentUser = null, currentData = null;
let currentCourse = null, currentLesson = null, pollTimer = null;
const audio   = document.getElementById('audio');
const videoEl = document.getElementById('video-el');
let queue = [], qi = -1, seeking = false;
let backedUpMap = {};
let videoActive = false;
let queuePanelOpen = false;
let shuffleOn = false, repeatOn = false;

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
window.addEventListener('DOMContentLoaded', async () => {
  await loadAccounts();
  initPlayer();
});

/* ═══════════════════════════════════════
   ACCOUNTS
═══════════════════════════════════════ */
async function loadAccounts() {
  accounts = await fetch('/accounts').then(r => r.json());
  renderAccTabs();
  if (accounts.length) await switchAccount(accounts[0].username);
}

function renderAccTabs() {
  document.getElementById('acc-tabs').innerHTML = accounts.map(a => `
    <div class="acc-tab ${a.username === currentUser ? 'active' : ''}"
      onclick="switchAccount('${a.username}')" role="tab"
      aria-selected="${a.username === currentUser}" tabindex="0"
      onkeydown="if(event.key==='Enter')switchAccount('${a.username}')">
      <div class="acc-avatar">${(a.label || a.username)[0].toUpperCase()}</div>
      <span>${esc(a.label || a.username)}</span>
    </div>`).join('');
}

async function switchAccount(u) {
  currentUser = u; currentData = null; currentCourse = null; currentLesson = null;
  backedUpMap = {};
  renderAccTabs();
  await loadData();
}

async function delAccount(u) {
  if (!confirm(`確定刪除帳號 ${u}？`)) return;
  await fetch(`/accounts/${u}`, { method: 'DELETE' });
  await loadAccounts();
}

function openAddModal() {
  document.getElementById('add-modal').classList.add('show');
  document.getElementById('add-err').style.display = 'none';
  ['new-label','new-username','new-password'].forEach(id => document.getElementById(id).value = '');
  setTimeout(() => document.getElementById('new-username').focus(), 50);
}
function closeAddModal() { document.getElementById('add-modal').classList.remove('show'); }

async function submitAdd() {
  const label    = document.getElementById('new-label').value.trim();
  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value.trim();
  const errEl    = document.getElementById('add-err');
  if (!username || !password) { errEl.textContent = '帳號和密碼不能為空'; errEl.style.display = 'block'; return; }
  const res  = await fetch('/accounts', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({username, password, label}) });
  const data = await res.json();
  if (data.error) { errEl.textContent = data.error; errEl.style.display = 'block'; return; }
  closeAddModal();
  await loadAccounts();
  await switchAccount(username);
}

/* ═══════════════════════════════════════
   SCRAPE
═══════════════════════════════════════ */
async function startScrape(username) {
  const u = username || currentUser;
  if (!u) return;
  const res = await fetch(`/scrape/${u}`, { method: 'POST' });
  const d   = await res.json();
  if (d.status === 'already_running') { alert('抓取中，請稍候'); return; }
  pollTimer = setInterval(() => pollStatus(u), 1400);
}

async function pollStatus(username) {
  const d = await fetch(`/scrape/${username}/status`).then(r => r.json());
  const p = d.progress || {};

  // 更新 main 區域的 banner
  if (username === currentUser && p.phase && p.phase !== 'done' && p.phase !== 'error') {
    const pct = p.pct || 0;
    document.getElementById('scraping-banner').style.display = 'block';
    document.getElementById('scraping-text').textContent =
      `${({login:'登入中',explore:'探索課程',media:'抓取媒體'}[p.phase]||p.phase)} — ${p.detail||''}`;
    document.getElementById('scraping-bar-fill').style.width = Math.max(2, pct) + '%';
  }

  document.getElementById('log-content').innerHTML =
    d.logs.map(l => `<div>${esc(l)}</div>`).join('');

  if (d.done || !d.running) {
    clearInterval(pollTimer); pollTimer = null;
    document.getElementById('scraping-banner').style.display = 'none';
    if (d.error) {
      document.getElementById('log-err-dot').style.display = 'block';
      document.getElementById('log-panel').classList.add('show');
    } else if (username === currentUser) {
      await loadData();
    }
    // 更新 wizard 步驟 2 狀態
    if (wizardStep === 2) renderWizardStep(2);
  }
}

/* ═══════════════════════════════════════
   DATA
═══════════════════════════════════════ */
async function loadData() {
  if (!currentUser) return;
  const [d, lib] = await Promise.all([
    fetch(`/data/${currentUser}`).then(r => r.json()),
    fetch(`/library/${currentUser}`).then(r => r.json()),
  ]);
  backedUpMap = {};
  for (const item of (lib.items || [])) backedUpMap[item.key] = item;

  if (d.courses?.length) {
    currentData = d;
    const a = accounts.find(x => x.username === currentUser);
    if (a && d.student_name) a.student_name = d.student_name;
    renderCourseUI();
  } else {
    currentData = null; currentCourse = null; currentLesson = null;
    document.getElementById('course-tabs').innerHTML = '';
    document.getElementById('mobile-course-tabs').innerHTML = '';
    document.getElementById('lesson-list').innerHTML =
      `<div style="text-align:center;padding:36px 16px;font-size:12px;color:var(--text-3);line-height:1.6">
        尚未有資料<br/>點「新學期 / 備份」開始
      </div>`;
    showWelcome();
  }
}

/* ═══════════════════════════════════════
   COURSE UI
═══════════════════════════════════════ */
function renderCourseUI() {
  if (!currentData) return;
  // Sidebar course tabs
  document.getElementById('course-tabs').innerHTML = currentData.courses.map(c => `
    <button class="ctab ${c.id === currentCourse ? 'active' : ''}"
      onclick="selectCourse('${c.id}')"
      role="tab" aria-selected="${c.id === currentCourse}">${esc(c.name)}</button>`).join('');
  // Mobile course tabs
  document.getElementById('mobile-course-tabs').innerHTML = currentData.courses.map(c => `
    <button class="mobile-ctab ${c.id === currentCourse ? 'active' : ''}"
      onclick="selectCourse('${c.id}')">${esc(c.name)}</button>`).join('');
  if (!currentCourse && currentData.courses.length) selectCourse(currentData.courses[0].id);
  else renderLessons();
}

function selectCourse(id) {
  currentCourse = id; currentLesson = null;
  document.querySelectorAll('.ctab').forEach(b => {
    b.classList.toggle('active', b.textContent === (currentData.courses.find(c => c.id === id)?.name || ''));
    b.setAttribute('aria-selected', b.classList.contains('active'));
  });
  document.querySelectorAll('.mobile-ctab').forEach(b => {
    b.classList.toggle('active', b.textContent === (currentData.courses.find(c => c.id === id)?.name || ''));
  });
  renderLessons();
  if (window.innerWidth <= 768) {
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('mobile-lesson-list').style.display = 'flex';
    document.getElementById('content-header').style.display = 'none';
    document.getElementById('tracks-section').style.display = 'none';
    document.getElementById('links-section').style.display = 'none';
  } else {
    showWelcome();
  }
}

function renderLessons() {
  const course = currentData?.courses.find(c => c.id === currentCourse);
  if (!course) return;
  const q = document.getElementById('search-input').value.toLowerCase();
  let html = '';
  for (const unit of course.units) {
    const ls = unit.lessons.filter(l => !q || l.name.toLowerCase().includes(q));
    if (!ls.length) continue;
    html += `<div class="lesson-group-label">Unit ${unit.id}</div>`;
    for (const l of ls) {
      const allMedia = (l.items||[]).filter(i => i.media?.some(m => ['mp3','mp4'].includes(m.type)));
      const backed   = allMedia.filter(i => backedUpMap[`${currentCourse}:${l.id}:${i.name}`]);
      const act      = l.url === currentLesson?.url;
      const badge    = allMedia.length
        ? `<span class="lesson-badge">${backed.length}/${allMedia.length}</span>` : '';
      html += `
        <div class="lesson-row ${act ? 'active' : ''}" role="button" tabindex="0"
          onclick="selectLesson(${json(l)})"
          onkeydown="if(event.key==='Enter')selectLesson(${json(l)})">
          <span class="lesson-name">${esc(l.name)}</span>
          ${badge}
        </div>`;
    }
  }
  const noResult = `<div style="text-align:center;padding:24px;font-size:12px;color:var(--text-3)">無結果</div>`;
  document.getElementById('lesson-list').innerHTML = html || noResult;
  document.getElementById('mobile-lesson-list').innerHTML = html || noResult;
}

function filterLessons() { renderLessons(); }

/* ═══════════════════════════════════════
   CONTENT VIEW
═══════════════════════════════════════ */
function selectLesson(lesson) {
  if (typeof lesson === 'string') lesson = JSON.parse(lesson);
  currentLesson = lesson;
  renderLessons();

  document.getElementById('mobile-lesson-list').style.display = 'none';
  document.getElementById('welcome').style.display = 'none';
  document.getElementById('content-header').style.display = 'block';

  const items  = lesson.items || [];
  const tracks = items.filter(i => i.media?.some(m => ['mp3','mp4'].includes(m.type)));
  const links  = items.filter(i => !i.media?.some(m => ['mp3','mp4'].includes(m.type)));

  document.getElementById('cv-title').textContent = lesson.name;

  const backedCount = tracks.filter(i => backedUpMap[`${currentCourse}:${lesson.id}:${i.name}`]).length;
  const meta = [
    tracks.length ? `${tracks.length} 個媒體` : '',
    tracks.length ? `已備份 ${backedCount}/${tracks.length}` : '',
    links.length  ? `${links.length} 個連結` : '',
  ].filter(Boolean).join(' · ');
  document.getElementById('cv-meta').textContent = meta;

  const playAllBtn = document.getElementById('play-all-btn');
  playAllBtn.style.display = backedCount > 0 ? 'flex' : 'none';

  const trackSec  = document.getElementById('tracks-section');
  const trackGrid = document.getElementById('track-grid');
  if (tracks.length) {
    trackSec.style.display = 'block';
    trackGrid.innerHTML = tracks.map(item => {
      const img       = item.media?.find(m => ['jpeg','jpg','png'].includes(m.type))?.url || '';
      const mediaType = item.media?.find(m => m.type === 'mp4') ? 'mp4' : 'mp3';
      const itemKey   = `${currentCourse}:${lesson.id}:${item.name}`;
      const isBacked  = !!backedUpMap[itemKey];
      const isPlaying = queue[qi]?.key === itemKey;
      const isActive  = isPlaying && (videoActive ? !videoEl.paused : !audio.paused);
      const artPh = mediaType === 'mp4'
        ? `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="color:var(--text-3)"><path d="M17 10.5V7a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h12a1 1 0 001-1v-3.5l4 4v-11l-4 4z"/></svg>`
        : `<svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="color:var(--text-3)"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;

      if (isBacked) {
        return `
          <div class="track-card ${isPlaying ? 'playing' : ''}" role="listitem" tabindex="0"
            onclick="playFromDropbox(${json(item.name)})"
            onkeydown="if(event.key==='Enter')playFromDropbox(${json(item.name)})"
            aria-label="播放 ${esc(item.name)}">
            <div class="card-art">
              ${img ? `<img src="${esc(img)}" alt="${esc(item.name)}" loading="lazy" onerror="this.style.display='none'"/>` : ''}
              ${artPh}
              <div class="card-play-overlay">
                <div class="play-circle">
                  ${isActive
                    ? `<div class="eq"><span></span><span></span><span></span></div>`
                    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>`}
                </div>
              </div>
            </div>
            <div class="card-title">${esc(item.name)}</div>
            <div class="card-sub">${esc(backedUpMap[itemKey]?.type || mediaType)}</div>
          </div>`;
      } else {
        return `
          <div class="track-card locked" role="listitem" aria-label="${esc(item.name)} — 未備份" title="請先備份才能播放">
            <div class="card-art">
              ${img ? `<img src="${esc(img)}" alt="${esc(item.name)}" loading="lazy" onerror="this.style.display='none'"/>` : ''}
              ${artPh}
              <div class="lock-overlay">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <span style="font-size:10px">未備份</span>
              </div>
            </div>
            <div class="card-title">${esc(item.name)}</div>
            <div class="card-sub" style="color:rgba(239,68,68,.6)">未備份</div>
          </div>`;
      }
    }).join('');
  } else {
    trackSec.style.display = 'none';
  }

  const linkSec  = document.getElementById('links-section');
  const linkList = document.getElementById('link-list');
  if (links.length) {
    linkSec.style.display = 'block';
    linkList.innerHTML = links.map(item => `
      <a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer" class="link-row" role="listitem">
        <div class="link-icon">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
        </div>
        <div>
          <div class="link-name">${esc(item.name)}</div>
          ${item.type ? `<div class="link-type">${esc(item.type)}</div>` : ''}
        </div>
      </a>`).join('');
  } else {
    linkSec.style.display = 'none';
  }

  document.getElementById('main').scrollTop = 0;
}

function showWelcome() {
  document.getElementById('mobile-lesson-list').style.display = 'none';
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('content-header').style.display = 'none';
  document.getElementById('tracks-section').style.display = 'none';
  document.getElementById('links-section').style.display = 'none';
}

function mobileLessonBack() {
  document.getElementById('content-header').style.display = 'none';
  document.getElementById('tracks-section').style.display = 'none';
  document.getElementById('links-section').style.display = 'none';
  document.getElementById('mobile-lesson-list').style.display = 'flex';
  currentLesson = null;
  renderLessons();
}

/* ═══════════════════════════════════════
   PLAYER
═══════════════════════════════════════ */
function initPlayer() {
  audio.addEventListener('timeupdate', () => { if (!videoActive) onTime(); });
  audio.addEventListener('ended',      () => { if (!videoActive) handleEnded(); });
  audio.addEventListener('loadedmetadata', () => {
    if (!videoActive) { document.getElementById('t-dur').textContent = fmt(audio.duration); syncNps(); }
  });
  audio.addEventListener('play',  () => { if (!videoActive) { setIcon(true);  syncNps(); } });
  audio.addEventListener('pause', () => { if (!videoActive) { setIcon(false); syncNps(); } });

  videoEl.addEventListener('timeupdate', () => { if (videoActive) onTime(); });
  videoEl.addEventListener('ended',      () => { if (videoActive) { closeVideoModal(); handleEnded(); } });
  videoEl.addEventListener('loadedmetadata', () => {
    if (videoActive) { document.getElementById('t-dur').textContent = fmt(videoEl.duration); syncNps(); }
  });
  videoEl.addEventListener('play',  () => { if (videoActive) { setIcon(true);  syncNps(); } });
  videoEl.addEventListener('pause', () => { if (videoActive) { setIcon(false); syncNps(); } });
}

function handleEnded() {
  if (repeatOn) { doPlay(); return; }
  if (shuffleOn && queue.length > 1) { qi = Math.floor(Math.random() * queue.length); doPlay(); return; }
  playerNext();
}

function playFromDropbox(itemName) {
  if (typeof itemName === 'string' && itemName.startsWith('"')) {
    try { itemName = JSON.parse(itemName); } catch(e) {}
  }
  if (!currentLesson || !currentCourse) return;
  const lessonId = currentLesson.id;
  const itemKey  = `${currentCourse}:${lessonId}:${itemName}`;
  if (!backedUpMap[itemKey]) return;

  const allItems = currentLesson.items || [];
  queue = [];
  for (const it of allItems) {
    const k = `${currentCourse}:${lessonId}:${it.name}`;
    if (backedUpMap[k]) {
      const b = backedUpMap[k];
      queue.push({
        name: it.name, type: b.type, dropbox_path: b.dropbox_path,
        lessonName: currentLesson.name,
        img: it.media?.find(m => ['jpeg','jpg','png'].includes(m.type))?.url || '',
        key: k,
      });
    }
  }
  qi = queue.findIndex(q => q.key === itemKey);
  if (qi < 0) qi = 0;
  doPlay();
}

function playAll() {
  if (!currentLesson || !currentCourse) return;
  const lessonId = currentLesson.id;
  queue = [];
  for (const it of currentLesson.items || []) {
    const k = `${currentCourse}:${lessonId}:${it.name}`;
    if (backedUpMap[k]) {
      const b = backedUpMap[k];
      queue.push({
        name: it.name, type: b.type, dropbox_path: b.dropbox_path,
        lessonName: currentLesson.name,
        img: it.media?.find(m => ['jpeg','jpg','png'].includes(m.type))?.url || '',
        key: k,
      });
    }
  }
  if (!queue.length) return;
  qi = 0; doPlay();
}

async function doPlay() {
  const t = queue[qi];
  if (!t?.dropbox_path) return;

  document.getElementById('np-title').textContent  = t.name;
  document.getElementById('np-lesson').textContent = t.lessonName;
  const img = document.getElementById('np-img');
  const ph  = document.getElementById('np-art-ph');
  if (t.img) { img.src = t.img; img.style.display = 'block'; ph.style.display = 'none'; }
  else        { img.style.display = 'none'; ph.style.display = 'flex'; }
  document.getElementById('player-bar').classList.add('up');
  syncNps();
  renderQueuePanel();

  let url;
  try {
    const res = await fetch(`/dropbox/link?path=${encodeURIComponent(t.dropbox_path)}`);
    if (!res.ok) { const e = await res.json().catch(() => ({})); alert(`播放失敗：${e.detail || res.statusText}`); return; }
    url = (await res.json()).url;
  } catch(e) { alert(`播放失敗：${e}`); return; }

  if (t.type === 'mp4') {
    audio.pause(); videoActive = true;
    openVideoModal(url, t.name);
  } else {
    if (videoActive) closeVideoModal();
    videoActive = false;
    audio.src = url;
    audio.play().catch(() => {});
  }
  if (currentLesson) refreshCards();
}

function openVideoModal(url, name) {
  document.getElementById('video-name-text').textContent = name || '';
  videoEl.src = url;
  videoEl.play().catch(() => {});
  document.getElementById('video-modal').classList.add('show');
  setIcon(true);
}
function closeVideoModal() {
  videoEl.pause(); videoEl.src = '';
  document.getElementById('video-modal').classList.remove('show');
  videoActive = false; setIcon(false);
}

function playerToggle() {
  if (videoActive) { videoEl.paused ? videoEl.play() : videoEl.pause(); }
  else             { audio.paused   ? audio.play()   : audio.pause();   }
}
function playerPrev() { if (qi > 0) { qi--; doPlay(); } }
function playerNext() {
  if (qi < queue.length - 1) { qi++; doPlay(); }
  else { if (videoActive) closeVideoModal(); audio.pause(); setIcon(false); }
}
function playerStop() {
  audio.pause(); audio.src = '';
  if (videoActive) closeVideoModal();
  queue = []; qi = -1;
  document.getElementById('player-bar').classList.remove('up');
  setIcon(false); renderQueuePanel();
  if (currentLesson) refreshCards();
}
function clearQueue() { playerStop(); }

function toggleShuffle() {
  shuffleOn = !shuffleOn;
  document.getElementById('shuffle-btn').classList.toggle('on', shuffleOn);
  document.getElementById('nps-shuffle').classList.toggle('on', shuffleOn);
}
function toggleRepeat() {
  repeatOn = !repeatOn;
  document.getElementById('repeat-btn').classList.toggle('on', repeatOn);
  document.getElementById('nps-repeat').classList.toggle('on', repeatOn);
}

function setIcon(playing) {
  ['ico-play','nps-ico-play'].forEach(id  => document.getElementById(id).style.display  = playing ? 'none'  : 'block');
  ['ico-pause','nps-ico-pause'].forEach(id => document.getElementById(id).style.display = playing ? 'block' : 'none');
}

function onTime() {
  if (seeking) return;
  const media = videoActive ? videoEl : audio;
  const pct   = media.duration ? media.currentTime / media.duration * 100 : 0;
  const seek  = document.getElementById('seek');
  seek.value  = pct; seek.style.setProperty('--p', pct + '%');
  document.getElementById('t-cur').textContent = fmt(media.currentTime);
  syncNps();
}

function onSeekInput()  { seeking = true; }
function onSeekChange() {
  const media = videoActive ? videoEl : audio;
  media.currentTime = document.getElementById('seek').value / 100 * (media.duration || 0);
  seeking = false;
}

function onVolChange() {
  const v = +document.getElementById('vol').value;
  audio.volume = v; videoEl.volume = v;
  document.getElementById('vol-on').style.display  = v > 0 ? 'block' : 'none';
  document.getElementById('vol-off').style.display = v > 0 ? 'none'  : 'block';
}
function toggleMute() {
  const muted = !audio.muted;
  audio.muted = muted; videoEl.muted = muted;
  document.getElementById('vol-on').style.display  = muted ? 'none'  : 'block';
  document.getElementById('vol-off').style.display = muted ? 'block' : 'none';
}

/* NOW PLAYING SCREEN (mobile) */
function openNowPlaying() {
  document.getElementById('now-playing-screen').classList.add('open');
  syncNps();
}
function closeNowPlaying() {
  document.getElementById('now-playing-screen').classList.remove('open');
}
function syncNps() {
  const t = queue[qi];
  if (!t) return;
  document.getElementById('nps-title').textContent  = t.name;
  document.getElementById('nps-sub').textContent    = t.lessonName;
  document.getElementById('nps-course').textContent = t.lessonName;
  // art
  const npsArt = document.getElementById('nps-art');
  if (t.img) {
    npsArt.innerHTML = `<img src="${esc(t.img)}" alt="" style="width:100%;height:100%;object-fit:cover"/>`;
  } else {
    npsArt.innerHTML = `<svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor" style="color:var(--text-3)"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`;
  }
  // seek + times
  const media = videoActive ? videoEl : audio;
  const pct = media.duration ? media.currentTime / media.duration * 100 : 0;
  const npsSeek = document.getElementById('nps-seek');
  npsSeek.value = pct; npsSeek.style.setProperty('--p', pct + '%');
  document.getElementById('nps-cur').textContent = fmt(media.currentTime);
  document.getElementById('nps-dur').textContent = fmt(media.duration || 0);
}

let npsSeeking = false;
function onNpsSeekInput()  { npsSeeking = true; }
function onNpsSeekChange() {
  const media = videoActive ? videoEl : audio;
  media.currentTime = document.getElementById('nps-seek').value / 100 * (media.duration || 0);
  npsSeeking = false;
  const pct = document.getElementById('nps-seek').value;
  document.getElementById('seek').value = pct;
  document.getElementById('seek').style.setProperty('--p', pct + '%');
}

/* QUEUE */
function toggleQueuePanel() {
  queuePanelOpen = !queuePanelOpen;
  document.getElementById('queue-panel').classList.toggle('open', queuePanelOpen);
  document.getElementById('queue-btn').classList.toggle('active', queuePanelOpen);
}
function renderQueuePanel() {

          `<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color:var(--text-3)"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>`}

function jumpTo(idx) { qi = idx; doPlay(); }

}

/* ═══════════════════════════════════════
   WIZARD
═══════════════════════════════════════ */
let wizardStep = 1;
let wizardSelectedAccounts = [];

function openWizard() {
  wizardStep = 1;
  wizardSelectedAccounts = accounts.map(a => a.username);
  document.getElementById('wizard-overlay').classList.add('open');
  renderWizardStep(1);
}
function closeWizard() {
  document.getElementById('wizard-overlay').classList.remove('open');
}

function updateWizardStepBar(step) {
  document.querySelectorAll('.wz-step').forEach(el => {
    const s = +el.dataset.step;
    el.classList.toggle('active', s === step);
    el.classList.toggle('done',   s < step);
  });
  document.getElementById('wz-back').style.display = step > 1 && step < 4 ? 'block' : 'none';
  const nextBtn = document.getElementById('wz-next');
  if (step === 4) {
    nextBtn.textContent = '開始聆聽'; nextBtn.disabled = false;
  } else if (step === 2) {
    nextBtn.textContent = '前往備份 →'; nextBtn.disabled = false;
  } else if (step === 3) {
    nextBtn.style.display = 'none';
  } else {
    nextBtn.textContent = '下一步 →'; nextBtn.disabled = false; nextBtn.style.display = '';
  }
}

function renderWizardStep(step) {
  const body = document.getElementById('wizard-body');
  updateWizardStepBar(step);

  if (step === 1) {
    // 帳號列表
    let html = `<div class="wz-section-title">選擇帳號</div>
      <div class="wz-section-sub">選擇要抓取新學期資料的帳號。若還沒有帳號，請先新增。</div>`;
    if (accounts.length === 0) {
      html += `<div style="text-align:center;padding:20px;color:var(--text-3);font-size:13px">還沒有帳號</div>
        <button onclick="closeWizard();openAddModal()" class="btn-primary" style="width:100%;margin-top:8px">新增帳號</button>`;
    } else {
      html += accounts.map(a => `
        <div class="wz-acc-row">
          <div class="wz-acc-avatar">${(a.label || a.username)[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div class="wz-acc-name">${esc(a.label || a.username)}</div>
            <div class="wz-acc-sub">${esc(a.username)}${a.student_name ? ' · ' + esc(a.student_name) : ''}</div>
          </div>
          <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;color:var(--text-3)">
            <input type="checkbox" ${wizardSelectedAccounts.includes(a.username) ? 'checked' : ''}
              onchange="toggleWzAcc('${a.username}', this.checked)"
              style="accent-color:var(--primary);width:16px;height:16px"/>
            選取
          </label>
        </div>`).join('');
      html += `<button onclick="closeWizard();openAddModal()" style="width:100%;padding:9px;border-radius:8px;border:1.5px dashed var(--border);font-size:12px;color:var(--text-3);margin-top:8px;transition:all .15s" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-3)'">+ 新增帳號</button>`;
    }
    body.innerHTML = html;

  } else if (step === 2) {
    // 抓取進度
    let html = `<div class="wz-section-title">抓取課程資料</div>
      <div class="wz-section-sub">系統會登入 Hess 帳號，自動找出所有課次的媒體連結。</div>`;
    for (const username of wizardSelectedAccounts) {
      const a = accounts.find(x => x.username === username);
      if (!a) continue;
      const state_pending = !scrape_states_cache[username];
      const state_running = scrape_states_cache[username]?.running;
      const state_done    = scrape_states_cache[username]?.done;
      const state_error   = scrape_states_cache[username]?.error;
      const pct = scrape_states_cache[username]?.pct || 0;
      const statusText = state_error ? `錯誤：${state_error}`
        : state_done ? '完成'
        : state_running ? (scrape_states_cache[username]?.detail || '抓取中...')
        : '等待開始';
      html += `
        <div class="wz-acc-row" id="wz-acc-row-${username}">
          <div class="wz-acc-avatar">${(a.label || a.username)[0].toUpperCase()}</div>
          <div style="flex:1;min-width:0">
            <div class="wz-acc-name">${esc(a.label || a.username)}</div>
            <div class="wz-acc-sub" id="wz-status-${username}">${esc(statusText)}</div>
            <div class="wz-progress-bg"><div class="wz-progress-fill" id="wz-prog-${username}" style="width:${pct}%"></div></div>
          </div>
        </div>`;
    }
    body.innerHTML = html;
    // 開始抓取
    for (const username of wizardSelectedAccounts) {
      if (!scrape_states_cache[username]?.done) {
        startScrapeForWizard(username);
      }
    }

  } else if (step === 3) {
    // 備份
    body.innerHTML = `<div class="wz-section-title">備份到 Dropbox</div>
      <div class="wz-section-sub">將抓取到的媒體備份到 Dropbox，之後才能串流播放。</div>
      <button onclick="closeWizard();openBackupModal()" class="btn-primary" style="width:100%">開啟備份選項</button>`;

  } else if (step === 4) {
    // 完成
    const total = wizardSelectedAccounts.reduce((s, u) => {
      const d = accounts.find(a => a.username === u);
      return s + (d ? 1 : 0);
    }, 0);
    body.innerHTML = `
      <div style="text-align:center;padding:32px 0">
        <div style="width:60px;height:60px;border-radius:18px;background:rgba(6,182,212,.15);
          display:flex;align-items:center;justify-content:center;margin:0 auto 20px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>
        </div>
        <div style="font-size:18px;font-weight:700;color:var(--text-1);margin-bottom:8px">完成！</div>
        <div style="font-size:13px;color:var(--text-3);line-height:1.7">
          資料已備份到 Dropbox<br/>
          從左側選擇課次，點封面即可播放
        </div>
      </div>`;
  }
}

// 快取抓取狀態（給 wizard 用）
let scrape_states_cache = {};

async function startScrapeForWizard(username) {
  scrape_states_cache[username] = { running: true, done: false, pct: 0, detail: '準備中...' };
  const res = await fetch(`/scrape/${username}`, { method: 'POST' });
  const d   = await res.json();
  if (d.status === 'already_running') {
    scrape_states_cache[username].detail = '抓取中（已在進行）';
  }
  pollWizardScrape(username);
}

function pollWizardScrape(username) {
  const timer = setInterval(async () => {
    const d = await fetch(`/scrape/${username}/status`).then(r => r.json());
    const p = d.progress || {};
    scrape_states_cache[username] = {
      running: d.running, done: d.done, error: d.error,
      pct: p.pct || 0, detail: p.detail || '',
    };
    // 更新 wizard UI
    const statusEl = document.getElementById(`wz-status-${username}`);
    const progEl   = document.getElementById(`wz-prog-${username}`);
    if (statusEl) statusEl.textContent = d.error ? `錯誤：${d.error}` : d.done ? '完成' : (p.detail || '抓取中...');
    if (progEl)   progEl.style.width = (p.pct || 0) + '%';
    // 更新主區域 log
    document.getElementById('log-content').innerHTML = d.logs.map(l => `<div>${esc(l)}</div>`).join('');
    if (d.done || !d.running) {
      clearInterval(timer);
      if (!d.error && username === currentUser) await loadData();
    }
  }, 1400);
}

function toggleWzAcc(username, checked) {
  if (checked) { if (!wizardSelectedAccounts.includes(username)) wizardSelectedAccounts.push(username); }
  else         { wizardSelectedAccounts = wizardSelectedAccounts.filter(u => u !== username); }
}

function wizardNext() {
  if (wizardStep === 4) { closeWizard(); return; }
  if (wizardStep === 1 && accounts.length === 0) return;
  wizardStep++;
  renderWizardStep(wizardStep);
}
function wizardBack() {
  if (wizardStep > 1) { wizardStep--; renderWizardStep(wizardStep); }
}

/* ═══════════════════════════════════════
   BACKUP MODAL
═══════════════════════════════════════ */
let bkList = [], bkSelected = {}, bkPollTimer = null;

async function openBackupModal() {
  if (!currentUser) { alert('請先選擇帳號'); return; }
  const modal = document.getElementById('backup-modal');
  modal.style.display = 'flex';
  show('bk-loading'); hide('bk-select'); hide('bk-progress'); hide('bk-done');
  document.getElementById('bk-sub').textContent   = '載入清單中...';
  document.getElementById('bk-title').textContent = '備份到 Dropbox';
  setBkFooter('select');
  try {
    const res = await fetch(`/backup-list/${currentUser}`);
    if (!res.ok) { alert('尚未抓取資料，請先完成第 2 步'); closeBackupModal(); return; }
    bkList = await res.json();
    bkSelected = {};
    bkList.forEach(l => { bkSelected[l.key] = true; });
    renderBkList(); hide('bk-loading'); show('bk-select'); updateBkSub(); enableBkStart();
  } catch(e) { alert('載入失敗：' + e); closeBackupModal(); }
}

function closeBackupModal() {
  document.getElementById('backup-modal').style.display = 'none';
  clearInterval(bkPollTimer);
}

function renderBkList() {
  const groups = {};
  bkList.forEach(l => {
    if (!groups[l.course_name]) groups[l.course_name] = [];
    groups[l.course_name].push(l);
  });
  let html = '';
  for (const [courseName, lessons] of Object.entries(groups)) {
    const allSel  = lessons.every(l => bkSelected[l.key]);
    const someSel = lessons.some(l => bkSelected[l.key]);
    html += `<div style="margin-bottom:16px">
      <div class="bk-course-hdr" onclick="bkToggleCourse('${esc(courseName)}')">
        <div class="bk-check ${allSel ? 'on' : ''}" style="${someSel && !allSel ? 'background:rgba(6,182,212,.3);border-color:var(--primary)' : ''}">
          ${allSel ? `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>` : ''}
        </div>
        <span style="font-size:12.5px;font-weight:600;color:#fff;flex:1">${esc(courseName)}</span>
      </div>
      ${lessons.map(l => `
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;padding:5px 0 5px 8px;border-radius:6px;transition:background .12s"
          onmouseover="this.style.background='var(--bg-hover)'" onmouseout="this.style.background='transparent'"
          onclick="bkToggleLesson('${esc(l.key)}')">
          <div class="bk-check ${bkSelected[l.key] ? 'on' : ''}">
            ${bkSelected[l.key] ? `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>` : ''}
          </div>
          <span style="font-size:12px;color:var(--text-2);flex:1">${esc(l.lesson_name)}</span>
          <span style="font-size:11px;color:var(--text-3)">${[l.mp3_count && `♪ ${l.mp3_count}`, l.mp4_count && `▶ ${l.mp4_count}`].filter(Boolean).join(' ')}</span>
        </label>`).join('')}
    </div>`;
  }
  document.getElementById('bk-list').innerHTML = html;
}

function bkToggleLesson(key) { bkSelected[key] = !bkSelected[key]; renderBkList(); updateBkSub(); enableBkStart(); }
function bkToggleCourse(name) {
  const ls = bkList.filter(l => l.course_name === name);
  const all = ls.every(l => bkSelected[l.key]);
  ls.forEach(l => { bkSelected[l.key] = !all; });
  renderBkList(); updateBkSub(); enableBkStart();
}
function bkSelectAll(val) { bkList.forEach(l => { bkSelected[l.key] = val; }); renderBkList(); updateBkSub(); enableBkStart(); }
function updateBkSub() {
  const sel = bkList.filter(l => bkSelected[l.key]);
  const mp3 = sel.reduce((s, l) => s + l.mp3_count, 0);
  const mp4 = sel.reduce((s, l) => s + l.mp4_count, 0);
  const parts = [mp3 && `${mp3} 首 MP3`, mp4 && `${mp4} 部 MP4`].filter(Boolean).join('、');
  document.getElementById('bk-sub').textContent = `已選 ${sel.length} 課次${parts ? `，共 ${parts}` : ''}`;
}
function enableBkStart() {
  const btn = document.getElementById('bk-start-btn');
  const has = Object.values(bkSelected).some(v => v);
  btn.disabled = !has;
  btn.style.opacity = has ? '1' : '0.4';
  btn.style.cursor  = has ? 'pointer' : 'not-allowed';
}

async function startBackup() {
  const keys = bkList.filter(l => bkSelected[l.key]).map(l => l.key);
  if (!keys.length) return;
  hide('bk-select'); show('bk-progress');
  setBkFooter('progress');
  document.getElementById('bk-title').textContent = '備份中...';
  document.getElementById('bk-sub').textContent   = '請稍候，正在下載並上傳';
  await fetch('/backup/start', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ username: currentUser, keys }) });
  bkPollTimer = setInterval(pollBackup, 1200);
}

async function pollBackup() {
  const s   = await fetch(`/backup/${currentUser}/status`).then(r => r.json());
  const pct = s.total > 0 ? Math.round(s.done_count / s.total * 100) : 0;
  document.getElementById('bk-prog-bar').style.width      = pct + '%';
  document.getElementById('bk-prog-pct').textContent      = pct + '%';
  document.getElementById('bk-prog-label').textContent    = s.current ? `正在上傳：${s.current}` : '處理中...';
  document.getElementById('bk-prog-detail').textContent   = `${s.done_count} / ${s.total} 項`;
  if (s.errors?.length) document.getElementById('bk-errors').innerHTML = s.errors.map(e => `<div>⚠ ${esc(e)}</div>`).join('');
  if (s.done) {
    clearInterval(bkPollTimer);
    hide('bk-progress'); show('bk-done');
    setBkFooter('done');
    document.getElementById('bk-title').textContent = '備份完成';
    document.getElementById('bk-sub').textContent   = '';
    document.getElementById('bk-done-detail').innerHTML =
      `上傳 <strong style="color:#fff">${s.uploaded}</strong> 個新檔案<br>跳過 ${s.skipped} 個（已存在）<br>` +
      (s.errors?.length ? `<span style="color:#EF4444">失敗 ${s.errors.length} 個</span><br>` : '') +
      `<span style="color:var(--text-3);font-size:11px">已儲存於 Dropbox App Folder</span>`;
    const lib = await fetch(`/library/${currentUser}`).then(r => r.json());
    backedUpMap = {};
    for (const item of (lib.items || [])) backedUpMap[item.key] = item;
    if (currentLesson) refreshCards();
    renderLessons();
    // 推進 wizard 到 step 4
    if (document.getElementById('wizard-overlay').classList.contains('open')) {
      wizardStep = 4; renderWizardStep(4);
    }
  }
}

function setBkFooter(state) {
  const f = document.getElementById('bk-footer');
  if (state === 'select') {
    f.innerHTML = `
      <button onclick="closeBackupModal()" class="btn-ghost" style="flex:none;padding:8px 16px">取消</button>
      <button id="bk-start-btn" onclick="startBackup()"
        style="display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:9px;
               background:var(--primary);color:#fff;font-size:13px;font-weight:600;
               transition:background .15s;opacity:.4;cursor:not-allowed" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m8 17 4 4 4-4"/></svg>
        開始備份
      </button>`;
    enableBkStart();
  } else if (state === 'progress') {
    f.innerHTML = `<span style="font-size:12px;color:var(--text-3)">備份進行中，請勿關閉...</span>`;
  } else if (state === 'done') {
    f.innerHTML = `<button onclick="closeBackupModal()" class="btn-primary" style="flex:none;padding:8px 20px">完成</button>`;
  }
}

/* ═══════════════════════════════════════
   UTILS
═══════════════════════════════════════ */
function refreshCards() { if (currentLesson) selectLesson(currentLesson); }
function hide(id) { document.getElementById(id).style.display = 'none'; }
function show(id) { document.getElementById(id).style.display = 'block'; }
function fmt(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s / 60), sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function json(obj) { return esc(JSON.stringify(JSON.stringify(obj))); }
</script>

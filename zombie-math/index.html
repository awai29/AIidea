<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學殭屍防線</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      font-family: 'Arial Black', Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── HUD 頂部列 ── */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(0,0,0,0.8);
      border-bottom: 2px solid #2a4a1a;
      flex-shrink: 0;
      z-index: 10;
    }
    #lives { font-size: 22px; }
    #score { color: #ffd700; font-size: 20px; font-weight: bold; }
    #wave-label { color: #aaa; font-size: 16px; }
    #combo-display {
      color: #ff6600;
      font-size: 14px;
      font-weight: bold;
      min-width: 80px;
      text-align: right;
    }

    /* ── 遊戲區 ── */
    #game-area {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #1a1a3a 0%, #1a2a0a 70%, #2d4a1e 100%);
      overflow: hidden;
    }

    /* 草地地面線 */
    #game-area::after {
      content: '';
      position: absolute;
      bottom: 80px;
      left: 0; right: 0;
      height: 4px;
      background: #4a7a30;
      box-shadow: 0 0 10px #4a7a30;
    }

    /* 玩家士兵 */
    #player {
      position: absolute;
      bottom: 80px;
      left: 40px;
      font-size: 44px;
      line-height: 1;
      z-index: 5;
    }

    /* 殭屍元素 */
    .zombie {
      position: absolute;
      bottom: 80px;
      text-align: center;
      cursor: default;
      z-index: 4;
    }
    .zombie-body { font-size: 42px; display: block; }
    .zombie-label {
      display: inline-block;
      background: #ffd700;
      color: #000;
      font-size: 14px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      border: 2px solid #cc9900;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* 爆炸特效 */
    .explosion {
      position: absolute;
      font-size: 48px;
      pointer-events: none;
      z-index: 6;
      animation: explode 0.5s ease-out forwards;
    }
    @keyframes explode {
      0%   { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2);   opacity: 0; }
    }

    /* 殭屍走路動畫 */
    @keyframes zombieWalk {
      0%, 100% { transform: rotate(-3deg); }
      50%       { transform: rotate(3deg); }
    }

    /* 畫面閃紅（扣命） */
    @keyframes redFlash {
      0%   { box-shadow: inset 0 0 0 0 rgba(255,0,0,0); }
      50%  { box-shadow: inset 0 0 60px 30px rgba(255,0,0,0.5); }
      100% { box-shadow: inset 0 0 0 0 rgba(255,0,0,0); }
    }
    #game-area.flash { animation: redFlash 0.5s ease-out; }

    /* ── 答題區 ── */
    #input-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.85);
      border-top: 2px solid #2a4a1a;
      flex-shrink: 0;
    }
    #input-area label { color: #ffd700; font-size: 16px; font-weight: bold; }
    #answer-input {
      width: 100px;
      padding: 8px 12px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      border: 3px solid #ffd700;
      border-radius: 8px;
      background: #fff;
      color: #000;
      outline: none;
    }
    #answer-input.shake {
      animation: shake 0.3s ease;
      border-color: #ff4444;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }
    #submit-btn {
      padding: 8px 20px;
      font-size: 16px;
      font-weight: bold;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #submit-btn:hover { background: #388E3C; }

    /* ── 覆蓋畫面（開始、結束、過波提示） ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      gap: 16px;
    }
    .overlay h1 { color: #ffd700; font-size: 42px; text-shadow: 0 0 20px #ffd700; }
    .overlay h2 { color: #fff; font-size: 28px; }
    .overlay p  { color: #ccc; font-size: 18px; }
    .overlay button {
      margin-top: 10px;
      padding: 12px 36px;
      font-size: 20px;
      font-weight: bold;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .overlay button:hover { background: #388E3C; }
    .wave-clear-msg {
      color: #7cfc00;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 0 0 15px #7cfc00;
    }
  </style>
</head>
<body>

  <!-- HUD 頂部列 -->
  <div id="hud">
    <div id="lives">❤️ ❤️ ❤️</div>
    <div id="score">分數：0</div>
    <div id="wave-label">第 1 波</div>
    <div id="combo-display"></div>
  </div>

  <!-- 遊戲主區域 -->
  <div id="game-area">
    <div id="player">🧑‍🦲🔫</div>
    <!-- 殭屍動態加入此區 -->

    <!-- 開始畫面覆蓋層 -->
    <div id="start-screen" class="overlay">
      <h1>🧟 數學殭屍防線 🧟</h1>
      <h2>輸入正確答案打倒殭屍！</h2>
      <p>殭屍走到左邊會扣命，3條命用完就遊戲結束</p>
      <button onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 結束畫面覆蓋層（預設隱藏） -->
    <div id="game-over-screen" class="overlay" style="display:none;">
      <h1>💀 遊戲結束 💀</h1>
      <h2 id="final-score">本次分數：0</h2>
      <p id="high-score-display">最高紀錄：0</p>
      <p id="accuracy-display">答題正確率：0%</p>
      <button onclick="startGame()">再玩一次</button>
    </div>
  </div>

  <!-- 答題區 -->
  <div id="input-area">
    <label for="answer-input">答案：</label>
    <input type="number" id="answer-input" placeholder="?" autocomplete="off">
    <button id="submit-btn" onclick="submitAnswer()">送出 ↵</button>
  </div>

  <script>
    // ── 佔位函式（Task 4、Task 5 會實作完整版本）──
    function startGame() { /* Task 5 實作 */ }
    function submitAnswer() { /* Task 4 實作 */ }
  </script>
</body>
</html>

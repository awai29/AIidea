<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>數學殭屍防線</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      font-family: 'Arial Black', Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* ── HUD 頂部列 ── */
    #hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: rgba(0,0,0,0.8);
      border-bottom: 2px solid #2a4a1a;
      flex-shrink: 0;
      z-index: 10;
    }
    #lives { font-size: 22px; }
    #score { color: #ffd700; font-size: 20px; font-weight: bold; }
    #wave-label { color: #aaa; font-size: 16px; }
    #combo-display {
      color: #ff6600;
      font-size: 14px;
      font-weight: bold;
      min-width: 80px;
      text-align: right;
    }

    /* ── 遊戲區 ── */
    #game-area {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #1a1a3a 0%, #1a2a0a 70%, #2d4a1e 100%);
      overflow: hidden;
    }

    /* 草地地面線 */
    #game-area::after {
      content: '';
      position: absolute;
      bottom: 80px;
      left: 0; right: 0;
      height: 4px;
      background: #4a7a30;
      box-shadow: 0 0 10px #4a7a30;
    }

    /* 玩家士兵 */
    #player {
      position: absolute;
      bottom: 80px;
      left: 40px;
      font-size: 44px;
      line-height: 1;
      z-index: 5;
    }

    /* 殭屍元素 */
    .zombie {
      position: absolute;
      bottom: 80px;
      text-align: center;
      cursor: default;
      z-index: 4;
    }
    .zombie-body { font-size: 42px; display: block; }
    .zombie-label {
      display: inline-block;
      background: #ffd700;
      color: #000;
      font-size: 14px;
      font-weight: bold;
      padding: 3px 10px;
      border-radius: 8px;
      margin-bottom: 4px;
      border: 2px solid #cc9900;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }

    /* 爆炸特效 */
    .explosion {
      position: absolute;
      font-size: 48px;
      pointer-events: none;
      z-index: 6;
      animation: explode 0.5s ease-out forwards;
    }
    @keyframes explode {
      0%   { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2);   opacity: 0; }
    }

    /* 殭屍走路動畫 */
    @keyframes zombieWalk {
      0%, 100% { transform: rotate(-3deg); }
      50%       { transform: rotate(3deg); }
    }

    /* 畫面閃紅（扣命） */
    @keyframes redFlash {
      0%   { box-shadow: inset 0 0 0 0 rgba(255,0,0,0); }
      50%  { box-shadow: inset 0 0 60px 30px rgba(255,0,0,0.5); }
      100% { box-shadow: inset 0 0 0 0 rgba(255,0,0,0); }
    }
    #game-area.flash { animation: redFlash 0.5s ease-out; }

    /* ── 答題區 ── */
    #input-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: rgba(0,0,0,0.85);
      border-top: 2px solid #2a4a1a;
      flex-shrink: 0;
    }
    #input-area label { color: #ffd700; font-size: 16px; font-weight: bold; }
    #answer-input {
      width: 100px;
      padding: 8px 12px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
      border: 3px solid #ffd700;
      border-radius: 8px;
      background: #fff;
      color: #000;
      outline: none;
    }
    #answer-input.shake {
      animation: shake 0.3s ease;
      border-color: #ff4444;
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }
    #submit-btn {
      padding: 8px 20px;
      font-size: 16px;
      font-weight: bold;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #submit-btn:hover { background: #388E3C; }

    /* ── 覆蓋畫面（開始、結束、過波提示） ── */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 20;
      gap: 16px;
    }
    .overlay h1 { color: #ffd700; font-size: 42px; text-shadow: 0 0 20px #ffd700; }
    .overlay h2 { color: #fff; font-size: 28px; }
    .overlay p  { color: #ccc; font-size: 18px; }
    .overlay button {
      margin-top: 10px;
      padding: 12px 36px;
      font-size: 20px;
      font-weight: bold;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
    .overlay button:hover { background: #388E3C; }
    .wave-clear-msg {
      color: #7cfc00;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 0 0 15px #7cfc00;
    }
    @keyframes scorePop {
      0%   { opacity:1; transform:translateY(0); }
      100% { opacity:0; transform:translateY(-20px); }
    }
  </style>
</head>
<body>

  <!-- HUD 頂部列 -->
  <div id="hud">
    <div id="lives">❤️ ❤️ ❤️</div>
    <div id="score">分數：0</div>
    <div id="wave-label">第 1 波</div>
    <div id="combo-display"></div>
  </div>

  <!-- 遊戲主區域 -->
  <div id="game-area">
    <div id="player">🧑‍🦲🔫</div>
    <!-- 殭屍動態加入此區 -->

    <!-- 開始畫面覆蓋層 -->
    <div id="start-screen" class="overlay">
      <h1>🧟 數學殭屍防線 🧟</h1>
      <h2>輸入正確答案打倒殭屍！</h2>
      <p>殭屍走到左邊會扣命，3條命用完就遊戲結束</p>
      <button onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 結束畫面覆蓋層（預設隱藏） -->
    <div id="game-over-screen" class="overlay" style="display:none;">
      <h1>💀 遊戲結束 💀</h1>
      <h2 id="final-score">本次分數：0</h2>
      <p id="high-score-display">最高紀錄：0</p>
      <p id="accuracy-display">答題正確率：0%</p>
      <button onclick="startGame()">再玩一次</button>
    </div>
  </div>

  <!-- 答題區 -->
  <div id="input-area">
    <label for="answer-input">答案：</label>
    <input type="number" id="answer-input" placeholder="?" autocomplete="off">
    <button id="submit-btn" onclick="submitAnswer()">送出 ↵</button>
  </div>

  <script>
    // ── 數學題產生器 ──────────────────────────────────────
    // 根據波數回傳 { question: '24 ÷ 6', answer: 4 }
    function generateQuestion(wave) {
      let type;
      if (wave <= 3) {
        type = Math.random() < 0.5 ? 'add' : 'sub';
      } else if (wave <= 6) {
        type = 'mul';
      } else if (wave <= 9) {
        type = 'div';
      } else {
        const types = ['add', 'sub', 'mul', 'div'];
        type = types[Math.floor(Math.random() * types.length)];
      }

      let a, b, question, answer;

      if (type === 'add') {
        a = randInt(10, 98);
        b = randInt(1, 99 - a);
        question = `${a} + ${b}`;
        answer = a + b;
      } else if (type === 'sub') {
        a = randInt(20, 99);
        b = randInt(1, a - 1);
        question = `${a} - ${b}`;
        answer = a - b;
      } else if (type === 'mul') {
        a = randInt(2, 9);
        b = randInt(2, 9);
        question = `${a} × ${b}`;
        answer = a * b;
      } else { // div
        b = randInt(2, 9);
        answer = randInt(2, 9);
        a = b * answer;
        question = `${a} ÷ ${b}`;
      }

      return { question, answer };
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    // ── 遊戲狀態 ──────────────────────────────────────────
    const state = {
      lives: 3,
      score: 0,
      wave: 1,
      combo: 0,
      comboActive: false,   // 連擊特效是否啟動（連對3題後下一發打2隻）
      correctCount: 0,
      totalAnswers: 0,
      zombies: [],          // 目前畫面上的殭屍陣列
      gameRunning: false,
      waveClearing: false,  // 正在進行波次切換
      zombieIdCounter: 0,   // 產生唯一 ID 用
      gameLoopId: null,
    };

    // ── 殭屍產生 ──────────────────────────────────────────
    // 在右邊隨機位置產生一隻殭屍，加入 DOM 與 state.zombies
    function spawnZombie() {
      const q = generateQuestion(state.wave);
      const id = `zombie-${state.zombieIdCounter++}`;
      const startX = window.innerWidth + 20; // 從右邊畫面外進入

      // DOM 元素
      const el = document.createElement('div');
      el.className = 'zombie';
      el.id = id;
      el.style.left = startX + 'px';
      el.innerHTML = `
        <div class="zombie-label">${q.question} = ?</div>
        <span class="zombie-body" style="display:inline-block;animation:zombieWalk 0.4s infinite">🧟</span>
      `;
      document.getElementById('game-area').appendChild(el);

      // 速度依波數決定（px / 秒）
      const speed = getZombieSpeed();

      state.zombies.push({ id, el, answer: q.answer, x: startX, speed });
    }

    function getZombieSpeed() {
      if (state.wave <= 3) return randInt(40, 60);
      if (state.wave <= 6) return randInt(60, 80);
      if (state.wave <= 9) return randInt(75, 100);
      return randInt(90, 130);
    }

    // ── 殭屍移動主迴圈 ────────────────────────────────────
    let lastTime = null;

    function gameLoop(timestamp) {
      if (!state.gameRunning) return;

      const dt = lastTime ? (timestamp - lastTime) / 1000 : 0;
      lastTime = timestamp;

      const PLAYER_X = 100; // 殭屍到達此 X 就扣命

      for (let i = state.zombies.length - 1; i >= 0; i--) {
        const z = state.zombies[i];
        z.x -= z.speed * dt;
        z.el.style.left = z.x + 'px';

        if (z.x < PLAYER_X) {
          // 殭屍到達邊界
          removeZombie(i);
          loseLife();
        }
      }

      // 檢查是否全部殭屍清除
      if (state.zombies.length === 0 && !state.waveClearing) {
        state.waveClearing = true;
        showWaveClear();
      }

      if (state.gameRunning) {
        state.gameLoopId = requestAnimationFrame(gameLoop);
      }
    }

    function removeZombie(index) {
      const z = state.zombies[index];
      z.el.remove();
      state.zombies.splice(index, 1);
    }

    function removeZombieById(id) {
      const index = state.zombies.findIndex(z => z.id === id);
      if (index !== -1) removeZombie(index);
    }

    function loseLife() {
      state.lives--;
      state.combo = 0;
      updateHUD();

      // 紅色閃爍
      const gameArea = document.getElementById('game-area');
      gameArea.classList.remove('flash');
      void gameArea.offsetWidth; // 強制 reflow 讓動畫重新觸發
      gameArea.classList.add('flash');
      setTimeout(() => gameArea.classList.remove('flash'), 500);

      if (state.lives <= 0) {
        endGame();
      }
    }

    function updateHUD() {
      // 生命值
      const redPart  = ['❤️', '❤️', '❤️'].slice(0, state.lives).join(' ');
      const darkPart = ['🖤', '🖤', '🖤'].slice(state.lives, 3).join(' ');
      const hearts   = [redPart, darkPart].filter(Boolean).join(' ');
      document.getElementById('lives').textContent = hearts;

      // 分數
      document.getElementById('score').textContent = `分數：${state.score.toLocaleString()}`;

      // 波數
      document.getElementById('wave-label').textContent = `第 ${state.wave} 波`;

      // 連擊
      const comboEl = document.getElementById('combo-display');
      if (state.combo >= 3) {
        comboEl.textContent = `🔥 連擊 x${state.combo}`;
      } else if (state.combo > 0) {
        comboEl.textContent = `連對 ${state.combo}`;
      } else {
        comboEl.textContent = '';
      }
    }

    // ── 遊戲開始 ─────────────────────────────────────────
    function startGame() {
      // 清除舊殭屍
      state.zombies.forEach(z => z.el.remove());
      Object.assign(state, {
        lives: 3, score: 0, wave: 1, combo: 0,
        comboActive: false, correctCount: 0, totalAnswers: 0,
        zombies: [], gameRunning: true, waveClearing: false,
        zombieIdCounter: 0,
      });

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over-screen').style.display = 'none';
      updateHUD();
      lastTime = null;
      startWave();
      requestAnimationFrame(gameLoop);
      document.getElementById('answer-input').focus();
    }

    // ── 波次開始 ─────────────────────────────────────────
    function startWave() {
      const count = getZombieCount();
      let spawned = 0;
      state.waveClearing = false; // 重置，防止 spawning 期間誤觸波次清除

      const interval = setInterval(() => {
        if (spawned >= count || !state.gameRunning) {
          clearInterval(interval);
          return;
        }
        spawnZombie();
        spawned++;
      }, 1200); // 每隻間隔 1.2 秒出現
    }

    function getZombieCount() {
      if (state.wave <= 3) return randInt(3, 5);
      if (state.wave <= 6) return randInt(4, 6);
      if (state.wave <= 9) return randInt(5, 7);
      return randInt(6, 8);
    }

    // ── 波次通過 ─────────────────────────────────────────
    function showWaveClear() {
      const msg = document.createElement('div');
      msg.className = 'wave-clear-msg';
      msg.style.cssText = 'position:absolute;top:40%;left:50%;transform:translateX(-50%);z-index:15;pointer-events:none;';
      msg.textContent = `✅ 第 ${state.wave} 波通過！`;
      document.getElementById('game-area').appendChild(msg);

      setTimeout(() => {
        msg.remove();
        state.wave++;
        state.waveClearing = false;
        updateHUD();
        startWave();
      }, 1500);
    }

    // ── 遊戲結束 ─────────────────────────────────────────
    function endGame() {
      state.gameRunning = false;
      cancelAnimationFrame(state.gameLoopId);

      // 儲存最高分
      const prev = parseInt(localStorage.getItem('zombieMathHighScore') || '0', 10);
      const high = Math.max(prev, state.score);
      localStorage.setItem('zombieMathHighScore', high);

      // 正確率
      const accuracy = state.totalAnswers > 0
        ? Math.round((state.correctCount / state.totalAnswers) * 100)
        : 0;

      document.getElementById('final-score').textContent = `本次分數：${state.score.toLocaleString()}`;
      document.getElementById('high-score-display').textContent = `最高紀錄：${high.toLocaleString()}`;
      document.getElementById('accuracy-display').textContent = `答題正確率：${accuracy}%（${state.correctCount}/${state.totalAnswers}）`;
      document.getElementById('game-over-screen').style.display = 'flex';
    }

    // ── 答題處理 ─────────────────────────────────────────
    function submitAnswer() {
      if (!state.gameRunning) return;

      const input = document.getElementById('answer-input');
      const val = parseInt(input.value, 10);
      input.value = '';
      input.focus();

      if (isNaN(val)) return;

      state.totalAnswers++;

      // 找出所有答案符合的殭屍，按 x 座標排序（最靠左的優先被打）
      const matches = state.zombies
        .filter(z => z.answer === val)
        .sort((a, b) => a.x - b.x);

      if (matches.length === 0) {
        // 答錯：輸入框震動
        input.classList.remove('shake');
        void input.offsetWidth;
        input.classList.add('shake');
        setTimeout(() => input.classList.remove('shake'), 300);
        return;
      }

      // 答對：連擊計數
      state.combo++;
      state.correctCount++;
      state.score += 10 * state.wave;

      // 連擊3題以上觸發貫穿（打2隻）
      const hitCount = state.comboActive ? 2 : 1;
      state.comboActive = state.combo >= 3; // 下一題是否啟動貫穿

      const toHit = matches.slice(0, hitCount);
      toHit.forEach(z => {
        showExplosion(z.x + 20, z.el.offsetTop);
        removeZombieById(z.id);
      });

      updateHUD();
      showScorePopup(10 * state.wave);
    }

    function showExplosion(x, y) {
      const el = document.createElement('div');
      el.className = 'explosion';
      el.textContent = '💥';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      document.getElementById('game-area').appendChild(el);
      setTimeout(() => el.remove(), 500);
    }

    function showScorePopup(points) {
      const popup = document.createElement('span');
      popup.textContent = `+${points}`;
      popup.style.cssText = `
        color:#7cfc00;font-weight:bold;font-size:18px;
        margin-left:8px;
        animation:scorePop 0.8s ease-out forwards;
        display:inline-block;
      `;
      document.getElementById('score').appendChild(popup);
      setTimeout(() => popup.remove(), 800);
    }

    // Enter 鍵觸發送出
    document.getElementById('answer-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitAnswer();
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>三國・一騎當千</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas" width="800" height="450"></canvas>

    <!-- 觸控按鍵覆蓋層 -->
    <div id="touch-controls">
      <!-- 左側方向鍵 -->
      <div class="touch-btn dpad-up"    data-key="ArrowUp">↑</div>
      <div class="touch-btn dpad-down"  data-key="ArrowDown">↓</div>
      <div class="touch-btn dpad-left"  data-key="ArrowLeft">←</div>
      <div class="touch-btn dpad-right" data-key="ArrowRight">→</div>

      <!-- 右側動作鍵 -->
      <div class="touch-btn action-x" data-key="KeyX"><span>跳</span><small>X</small></div>
      <div class="touch-btn action-z" data-key="KeyZ"><span>攻</span><small>Z</small></div>
      <div class="touch-btn action-c" data-key="KeyC"><span>衝</span><small>C</small></div>

      <!-- 暫停按鈕（右上角） -->
      <div class="touch-btn btn-pause" id="btn-pause">⏸</div>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
  <script>
    // 整數縮放：考慮 Retina DPR，以物理像素計算最大整數倍
    // Retina(DPR=2) 1440px 視窗 → 物理 2880px → 可放 3× game → CSS 1440px
    function applyIntegerScale() {
      const W = 800, H = 450;
      const dpr = window.devicePixelRatio || 1;
      // 用物理像素算最大整數倍，再換回 CSS 像素
      const physScaleX = Math.floor(window.innerWidth  * dpr / W);
      const physScaleY = Math.floor(window.innerHeight * dpr / H);
      const physScale  = Math.max(dpr, Math.min(physScaleX, physScaleY));
      const cssW = Math.round(W * physScale / dpr);
      const cssH = Math.round(H * physScale / dpr);
      const c = document.getElementById('game-container');
      if (c) { c.style.width = cssW + 'px'; c.style.height = cssH + 'px'; }
    }
    applyIntegerScale();
    window.addEventListener('resize', applyIntegerScale);
  </script>
  <script>
    // 觸控按鍵事件綁定（在 load 後執行，等待 main.js 初始化）
    window.addEventListener('load', () => {
      // 暫停按鈕（不走 data-key 機制，直接觸發 ESC）
      const pauseBtn = document.getElementById('btn-pause');
      if (pauseBtn) {
        const fireEsc = () => document.dispatchEvent(new KeyboardEvent('keydown', { code: 'Escape', bubbles: true }));
        pauseBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireEsc(); }, { passive: false });
        pauseBtn.addEventListener('mousedown',  (e) => { e.preventDefault(); fireEsc(); });
      }

      document.querySelectorAll('.touch-btn[data-key]').forEach(btn => {
        const key = btn.dataset.key;

        // 觸控事件（手機）
        btn.addEventListener('touchstart', (e) => {
          e.preventDefault();
          if (window.touchPressKey) window.touchPressKey(key);
          btn.classList.add('pressed');
        }, { passive: false });

        btn.addEventListener('touchend', (e) => {
          e.preventDefault();
          if (window.touchReleaseKey) window.touchReleaseKey(key);
          btn.classList.remove('pressed');
        }, { passive: false });

        btn.addEventListener('touchcancel', () => {
          if (window.touchReleaseKey) window.touchReleaseKey(key);
          btn.classList.remove('pressed');
        });

        // 滑鼠事件（桌機測試用）
        btn.addEventListener('mousedown', (e) => {
          e.preventDefault();
          if (window.touchPressKey) window.touchPressKey(key);
          btn.classList.add('pressed');
        });

        btn.addEventListener('mouseup', () => {
          if (window.touchReleaseKey) window.touchReleaseKey(key);
          btn.classList.remove('pressed');
        });

        btn.addEventListener('mouseleave', () => {
          if (window.touchReleaseKey) window.touchReleaseKey(key);
          btn.classList.remove('pressed');
        });
      });
    });
  </script>
</body>
</html>
